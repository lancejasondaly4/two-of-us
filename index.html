<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Two of Us: A Get-to-Know-You Game</title>
<meta name="description" content="A gentle two-person game. Answer warm questions about your life, and they become a puzzle for someone you love to solve, and a reason to talk.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F5A5A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Two of Us">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --linen:#F7F2E9; --card:#FFFDF8; --ink:#2A2622; --muted:#6E655B;
    --teal:#1F5A5A; --teal-soft:#E4EEEC; --rose:#A65A52; --rose-soft:#F2E6E3;
    --amber:#D99B2B; --amber-soft:#FBEFD6; --line:#E5DCCB;
    --display:"Fraunces", Georgia, serif; --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:var(--body); background:var(--linen); color:var(--ink); font-size:20px; line-height:1.5;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;}
  #app{max-width:820px; margin:0 auto; min-height:100vh;
    padding:calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));}
  /* The crossword wants room: let it use far more of the screen than the reading width. */
  #app[data-screen="crossword"]{max-width:min(98vw,1180px);}
  h1,h2,h3{font-family:var(--display); font-weight:600; line-height:1.12; margin:0;}
  h1{font-size:2.6rem; letter-spacing:-0.01em;} h2{font-size:2rem;} h3{font-size:1.4rem;}
  p{margin:0 0 1rem;} .lead{font-size:1.18rem; color:var(--muted);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:30px; box-shadow:0 2px 0 var(--line);}
  .stack > * + *{margin-top:18px;}
  button,.btn{font-family:var(--body); font-size:1.2rem; font-weight:700; min-height:64px; padding:14px 26px;
    border-radius:14px; cursor:pointer; border:2px solid var(--ink); background:var(--ink); color:var(--card); width:100%;
    transition:transform .08s ease, background .15s ease;}
  button:hover{transform:translateY(-1px);} button:active{transform:translateY(1px);}
  button:focus-visible{outline:4px solid var(--amber); outline-offset:3px;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink);}
  /* The always-there way back (top-left of every setup screen). Big tap target, quiet look. */
  .navback{display:inline-flex; align-items:center; gap:6px; width:auto; min-height:48px; padding:8px 16px 8px 6px; margin:0 0 4px -6px;
    border:0; background:none; color:var(--teal); font-size:1.15rem; box-shadow:none;}
  .navback:hover{transform:none; text-decoration:underline; text-underline-offset:4px;}
  .btn-teal{background:var(--teal); border-color:var(--teal); color:#fff;}
  .btn-rose{background:var(--rose); border-color:var(--rose); color:#fff;}
  .btn-amber{background:var(--amber); border-color:var(--amber); color:#3a2c08;}
  .btn-row{display:flex; gap:14px; flex-wrap:wrap;} .btn-row > *{flex:1; min-width:200px;}
  /* Game menu buttons carry a plain line saying what you actually do. */
  .game-btn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; text-align:center; padding:16px 22px;}
  .game-name{line-height:1.2;}
  .game-blurb{font-size:.95rem; font-weight:400; line-height:1.3; opacity:.85;}
  input[type=text],.ans-input{font-family:var(--body); font-size:1.4rem; width:100%; padding:16px 18px;
    border:2px solid var(--line); border-radius:14px; background:#fff; color:var(--ink);}
  input[type=text]:focus,.ans-input:focus{outline:none; border-color:var(--teal);}
  .eyebrow{font-size:.95rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .center{text-align:center;}
  .pill{display:inline-block; padding:6px 16px; border-radius:999px; font-weight:700; font-size:1rem;}
  .pill-teal{background:var(--teal-soft); color:var(--teal);} .pill-rose{background:var(--rose-soft); color:var(--rose);}
  .pill-amber{background:var(--amber-soft); color:#8a5a00;}
  .dots{display:flex; gap:8px; justify-content:center; margin:10px 0 4px;}
  .dot{width:11px; height:11px; border-radius:50%; background:var(--line);} .dot.on{background:var(--teal);} .dot.on.rose{background:var(--rose);}
  .steps{display:grid; gap:14px;} .step{display:flex; gap:16px; align-items:flex-start;}
  .step .n{font-family:var(--display); font-size:1.5rem; color:var(--amber); min-width:34px;}
  .reveal{border:2px solid var(--amber); background:var(--amber-soft); border-radius:18px; padding:22px 24px;}
  .reveal .label{font-size:1rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--amber);}
  .reveal .ans{font-family:var(--display); font-size:1.9rem; margin:4px 0 10px;}
  .reveal .talk{font-size:1.05rem;} .reveal .talk b{color:var(--teal);}
  .linkbox{font-family:ui-monospace,monospace; font-size:.95rem; width:100%; padding:14px; border:2px dashed var(--teal);
    border-radius:12px; background:#fff; color:var(--ink); word-break:break-all; min-height:96px; resize:none;}
  .share-way{border-top:1px solid var(--line); padding-top:18px;}
  .share-way:first-child{border-top:0; padding-top:0;}
  .share-way h3{display:flex; align-items:center; gap:10px;}
  .share-way .num{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; flex:0 0 auto;
    border-radius:50%; background:var(--teal); color:#fff; font-family:var(--body); font-size:1.1rem; font-weight:700;}
  .qrframe{width:264px; max-width:80vw; margin:14px auto 4px; background:#fff; padding:16px;
    border-radius:16px; border:1px solid var(--line); box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .qrframe svg{display:block; width:100%; height:auto;}
  .summary-card{border:1px solid var(--line); border-radius:14px; padding:16px 18px; background:#fff;}
  .summary-card .label{font-size:.9rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .summary-card .v{font-family:var(--display); font-size:1.5rem;}
  .hint{color:var(--muted); font-size:1.05rem;}
  .modecard{border:1px solid var(--line); border-radius:18px; padding:24px; background:var(--card); text-align:left;}
  .rel-list{margin-top:4px;} .rel-btn{margin-bottom:12px;}
  .agreebox{display:flex; gap:14px; align-items:center; font-size:1.15rem; background:#fff; border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; cursor:pointer; margin-top:10px;}
  .agreebox input{width:28px; height:28px; flex:0 0 auto;}
  a.btn{display:flex; align-items:center; justify-content:center; text-decoration:none;}
  /* Memory Match */
  .mem-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .mem-card{min-height:88px; font-size:1.05rem; line-height:1.2; padding:10px; text-align:center;
    background:var(--teal); border-color:var(--teal); color:#fff;}
  .mem-card.up{background:#fff; color:var(--ink); border-color:var(--line);}
  .mem-card.matched{background:var(--teal-soft); border-color:var(--teal-soft); color:var(--muted);}
  @keyframes bloomIn{0%{transform:scale(.72); opacity:0;} 60%{transform:scale(1.07);} 100%{transform:scale(1); opacity:1;}}
  .bloom{animation:bloomIn .5s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes spark{0%{transform:scale(0) rotate(0deg); opacity:0;} 35%{opacity:1;} 100%{transform:scale(1.5) rotate(28deg); opacity:0;}}
  /* crossword (warm, tasteful: teal frame on a soft board, clues on the right) */
  /* No card frame: the grid sits straight on the page like the finish view (cleaner). Clues beside it. */
  .xw-board{display:grid; grid-template-columns:auto auto; gap:28px; align-items:start;
    width:fit-content; max-width:100%; margin:2px auto 0;
    background:none; border:0; border-radius:0; padding:0; box-shadow:none;}
  .xw-gridwrap{display:flex; justify-content:center;}
  /* Soft-toned blocks recede; the white answer cells sit RAISED above the board like tiles. */
  .xw-grid{display:grid; gap:3px; background:#A9C4BE; border:3px solid #A9C4BE; border-radius:8px; margin:0 auto; box-shadow:0 1px 3px rgba(31,90,90,.10);}
  .xw-block{aspect-ratio:1; background:#B7CEC9; border-radius:2px; box-shadow:inset 0 1px 2px rgba(31,90,90,.16);}
  .xw-cell{position:relative; aspect-ratio:1; background:#FBF4E4; display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:visible; font-family:var(--body); font-weight:700; color:var(--ink); text-transform:uppercase;
    border-radius:3px; box-shadow:0 1.5px 0 rgba(31,90,90,.22), 0 2px 4px rgba(31,90,90,.18);
    font-size:calc(var(--cs,30px)*0.5); line-height:1;}
  .xw-cell.active{background:var(--amber-soft);}
  .xw-cell.cursor{background:var(--amber);}
  /* Ripple on solve. ACROSS words bounce vertically (undulate); DOWN words shimmy
     sideways (snake) — motion is always ACROSS the word so it reads as a travelling wave. */
  @keyframes xwWave{ 0%,100%{transform:translateY(0) scale(1);} 30%{transform:translateY(-30%) scale(1.08);} 58%{transform:translateY(0) scale(1);} }
  @keyframes xwSnake{ 0%,100%{transform:translateX(0) scale(1);} 30%{transform:translateX(-28%) scale(1.06);} 58%{transform:translateX(0) scale(1);} }
  .xw-cell.xw-wave{ animation:xwWave .5s ease-in-out both; z-index:3; }
  .xw-cell.xw-snake{ animation:xwSnake .5s ease-in-out both; z-index:3; }
  /* A cute glyph springs up off the last tile as the ripple finishes, then floats away.
     Gentle scale-in (no hard overshoot), a long soft rise with a slight sway. */
  @keyframes xwPop{ 0%{transform:translate(-50%,15%) scale(.3) rotate(-6deg); opacity:0;}
    18%{opacity:1;}
    32%{transform:translate(-50%,-55%) scale(1.06) rotate(3deg); opacity:1;}
    68%{transform:translate(-50%,-150%) scale(1) rotate(-2deg); opacity:1;}
    100%{transform:translate(-50%,-235%) scale(.92) rotate(2deg); opacity:0;} }
  .xw-pop{position:absolute; left:50%; top:0; transform:translate(-50%,0); font-size:calc(var(--cs,30px)*0.95);
    line-height:1; pointer-events:none; z-index:6; will-change:transform,opacity;
    animation:xwPop 1.5s cubic-bezier(.22,.61,.36,1) both;}
  .xw-num{position:absolute; top:0; left:2px; font-family:var(--body); font-weight:600; font-size:calc(var(--cs,30px)*0.3); line-height:1.1; color:var(--muted);}
  /* Tiles are a warm cream everywhere (play + finish) — softer on the eyes than stark white.
     The finish grid just locks the cursor since it isn't interactive. */
  .xw-grid.solved .xw-cell{cursor:default;}
  .xw-learned{margin:20px auto 0; max-width:520px;}
  .xw-learned .summary-card{margin-top:12px;}
  /* right-side clue panel (always visible, no toggle) */
  /* Across list, then Down list below it. No height cap, so no nested scrollbar. */
  .xw-cluepanel{display:flex; flex-direction:column; gap:18px; min-width:220px; max-width:420px;}
  @media(max-width:600px){
    .xw-board{grid-template-columns:1fr; gap:14px; padding:0; width:auto;}
    .xw-cluepanel{min-width:0; max-width:none;}
  }
  .xw-msg{margin:8px 0 0;}
  /* phone crossword (layout D, r20): full screen; the puzzle scrolls; the question and the
     game's own keyboard are docked at the bottom (the phone's keyboard never opens). */
  body:has(.xwd){overflow:hidden; overscroll-behavior:none;}
  .xwd{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; background:var(--linen);
    padding-top:env(safe-area-inset-top); height:100%; height:100dvh;}
  .xwd button{width:auto; min-height:0; transition:none;}
  .xwd button:hover, .xwd button:active{transform:none;}
  .xwd-top{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:4px 10px 2px;}
  .xwd-who{font-size:.9rem; color:var(--muted); font-weight:700;}
  .xwd .xwd-link{border:0; background:none; box-shadow:none; color:var(--teal); font-family:var(--body); font-weight:700; font-size:1rem; padding:8px 4px; min-height:42px;}
  .xwd-board{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 8px 12px; scrollbar-width:none;}
  .xwd-board::-webkit-scrollbar{display:none;}
  .xwd .xwd-grid{width:max-content; gap:2px; border-width:2px; margin:0 auto;}
  .xwd-grid .xw-cell{font-size:calc(var(--cs)*0.6); border-radius:3px;}
  .xwd-grid .xw-num{font-size:max(8px, calc(var(--cs)*0.3));}
  .xwd-grid .xw-cell.active{background:#F2D49A;}
  .xwd-grid .xw-cell.cursor{background:var(--amber);}
  .xwd-grid .xw-cell.xwd-solved{color:var(--teal);}
  .xwd-dock{flex:0 0 auto; background:#E9E3D8; border-top:1px solid var(--line); padding:0 0 calc(6px + env(safe-area-inset-bottom));}
  .xwd-talk{margin:8px 8px 0; padding:10px 14px;}
  .xwd-talk .talk{font-size:1rem; line-height:1.35;}
  .xwd-hintrow{display:flex; justify-content:flex-end; padding:0 8px;}
  .xwd-clue{display:flex; align-items:center; margin:0 6px 7px; background:var(--card); border-radius:12px; min-height:64px; box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .xwd .xwd-arrow{flex:0 0 40px; align-self:stretch; border:0; background:none; box-shadow:none; color:var(--teal); font-size:1.9rem; padding:0; font-weight:400;}
  .xwd-q{flex:1; text-align:center; padding:8px 2px; cursor:pointer; font-family:var(--display); font-size:1.12rem; line-height:1.22;}
  .xwd-tag{display:block; font-family:var(--body); font-size:.8rem; color:var(--muted); font-weight:700; margin-bottom:2px;}
  .xwd-kb{display:flex; flex-direction:column; gap:7px; padding:0 3px;}
  .xwd-row{display:flex; justify-content:center; gap:5px;}
  .xwd .xwd-kb button{flex:1 1 0; max-width:40px; height:46px; border:0; border-radius:7px; background:var(--card); color:var(--ink);
    font-family:var(--body); font-size:1.3rem; font-weight:700; box-shadow:0 1px 0 rgba(0,0,0,.25); padding:0; touch-action:manipulation;}
  .xwd .xwd-kb button:active{background:var(--amber-soft);}
  .xwd .xwd-kb .xwd-del{max-width:64px; flex:1.6 1 0; font-size:1.15rem;}
  .xwd-finish{display:flex; flex-direction:column; gap:10px; padding:12px 12px 4px;}
  .xwd-done{font-size:1.05rem; line-height:1.35; text-align:center;}
  .xwd .xwd-finish .btn-amber{width:100%; min-height:56px;}
  .xwd-finrow{display:flex; justify-content:space-around;}
  .xw-cluebar{display:flex; align-items:stretch; margin:10px 0 8px; border-radius:10px; overflow:hidden; border:1px solid #b9d4ef; background:#dce9f7;}
  .xw-arrow{flex:0 0 auto; width:46px; min-height:0; padding:0; border:0; border-radius:0; background:#cdddf0; color:#11406b;
    font-size:1.7rem; line-height:1; font-weight:700; cursor:pointer;}
  .xw-arrow:active{background:#bcd2ea;}
  .xw-cluetext{flex:1 1 auto; display:flex; align-items:center; gap:8px; padding:11px 14px; font-size:1.08rem; line-height:1.3; cursor:pointer;}
  .xw-cluetext b{color:#11406b;}
  /* Quiet footer: the puzzle is the hero, navigation stays restrained. */
  .xw-foot{display:flex; justify-content:center; align-items:center; gap:16px; flex-wrap:wrap; margin:16px 0 0;}
  .xw-hint{display:inline-flex; align-items:center; width:auto; min-height:0; padding:10px 20px; border-radius:999px;
    border:1px solid var(--teal); background:var(--card); color:var(--teal); font-family:var(--body); font-weight:700; font-size:.95rem; cursor:pointer;}
  .xw-back{display:inline-flex; align-items:center; width:auto; min-height:0; padding:10px 16px; border:0; background:none;
    color:var(--muted); font-family:var(--body); font-weight:700; font-size:.95rem; cursor:pointer; text-decoration:underline; text-underline-offset:3px;}
  .xw-back:hover{color:var(--ink);}
  .xw-cluecol h3{font-family:var(--display); font-size:1.2rem; margin-bottom:6px; color:var(--teal); border-bottom:2px solid var(--teal-soft); padding-bottom:4px;}
  .xw-cluecol ul{list-style:none; margin:0; padding:0;}
  .xw-clue{display:flex; gap:8px; padding:7px 10px; font-size:1rem; line-height:1.3; cursor:pointer; border-radius:8px;}
  .xw-clue b{color:var(--teal); flex:0 0 auto;}
  .xw-clue.cur{background:var(--amber-soft); box-shadow:inset 3px 0 0 var(--amber);}
  .xw-clue.done{color:var(--muted); text-decoration:line-through;}
  .rev-row{display:block;}
  .rev-label{display:block; font-weight:700; font-size:.92rem; letter-spacing:.02em; color:var(--muted); margin:0 0 4px 2px;}
  .rev-input{width:100%; font-size:1.15rem; padding:12px 14px; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-family:var(--body);}
  .rev-input:focus{border-color:var(--teal); outline:none;}
  .sc{min-height:1.5em; white-space:pre-wrap; word-break:break-word; cursor:text;}
  .sc:empty:before{content:attr(data-ph); color:var(--muted);}
  .ms{text-decoration:underline; text-decoration-style:wavy; text-decoration-color:#d11; text-decoration-skip-ink:none; -webkit-text-decoration:#d11 wavy underline;}
  @media (min-width:560px){ .mem-grid{grid-template-columns:repeat(4,1fr);} }
  @media (max-width:560px){ h1{font-size:2.05rem;} h2{font-size:1.6rem;} .card{padding:22px;} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>

/* ===================== SPELL CHECK =====================
   Native browser spell-check skips capitalised words (it assumes proper nouns),
   so it misses answers like "Saturnn". We do our own: a bundled word list is
   loaded once, and misspelled words get a red wavy underline in the editable
   review fields (contenteditable, since <input> can't draw custom underlines). */
let DICT=null, DICT_STATE='loading', DICT_DETAIL='';   // 'loading' | 'ready' | 'unavailable'
function spellStatusText(){
  if(DICT_STATE==='ready') return 'Spell-check on';
  if(DICT_STATE==='loading') return 'Loading spell-check…';
  return 'Spell-check unavailable ['+DICT_DETAIL+']';
}
function setDictState(s){ DICT_STATE=s;
  document.querySelectorAll('[data-spellstatus]').forEach(el=>el.textContent=spellStatusText());
  if(s==='ready') document.querySelectorAll('.sc').forEach(paintSpell);   // repaint anything already on screen
}
(async function loadDict(){
  const tr=[];   // diagnostic trace, surfaced in the status line if loading fails
  try{
    let text=null;
    tr.push('DS:'+('DecompressionStream' in window?'y':'n'));
    // Preferred: tiny gzipped list, unpacked with DecompressionStream (modern browsers).
    if('DecompressionStream' in window){
      try{ const res=await fetch('words.txt.gz'); tr.push('gz:'+res.status);
        if(res.ok&&res.body){ text=await new Response(res.body.pipeThrough(new DecompressionStream('gzip'))).text(); tr.push('gzlen:'+text.length); } }
      catch(e){ tr.push('gzERR:'+(e.name||e.message)); text=null; }
    }
    // Fallback: plain uncompressed list, no special API needed (older browsers / webviews).
    if(text==null){
      try{ const r2=await fetch('words.txt'); tr.push('txt:'+r2.status); if(r2.ok){ text=await r2.text(); tr.push('txtlen:'+text.length); } }
      catch(e){ tr.push('txtERR:'+(e.name||e.message)); }
    }
    DICT_DETAIL=tr.join(' ');
    if(text==null){ setDictState('unavailable'); return; }
    const d=new Set(); for(const w of text.split('\n')){ const t=w.trim(); if(t) d.add(t); } DICT=d;
    setDictState('ready');
  }catch(e){ DICT_DETAIL=tr.join(' ')+' fatal:'+(e.name||e.message); setDictState(DICT?'ready':'unavailable'); }
})();
function misspelled(word){ if(!DICT) return false; const w=word.toLowerCase().replace(/[^a-z]/g,''); return w.length>=2 && !DICT.has(w); }
function caretOffset(el){ const s=getSelection(); if(!s||!s.rangeCount) return null; const r=s.getRangeAt(0); if(!el.contains(r.endContainer)) return null;
  const pre=r.cloneRange(); pre.selectNodeContents(el); pre.setEnd(r.endContainer,r.endOffset); return pre.toString().length; }
function setCaret(el,off){ const s=getSelection(), r=document.createRange(), wk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let n,seen=0,done=false;
  while(n=wk.nextNode()){ const len=n.textContent.length; if(seen+len>=off){ r.setStart(n,Math.max(0,off-seen)); r.collapse(true); done=true; break; } seen+=len; }
  if(!done){ r.selectNodeContents(el); r.collapse(false); } s.removeAllRanges(); s.addRange(r); }
function paintSpell(el){ const text=el.textContent, off=caretOffset(el); let html='';
  for(const part of text.split(/(\s+)/)){ if(part==='') continue;
    if(/^\s+$/.test(part)){ html+=part; continue; }
    html += misspelled(part) ? `<span class="ms">${esc(part)}</span>` : esc(part); }
  el.innerHTML=html; if(off!=null) setCaret(el,off); }

/* ===================== GOING BACK =====================
   Every screen change remembers where you came from, so there is always a way
   back: the on-screen "Back" button AND the phone's own back gesture/button
   (each move forward adds a browser history entry; popstate steps us back).
   Inside the questions, back steps one question at a time.
   The game menus are HUBS: arriving at one resets the trail, so Back from a
   menu never walks you back into a half-played game. */
const HUB_PARENT = { home:null, menu:null, themmenu:'received' };
function snap(){ return {screen:S.screen, qi:S.qi, si:S.si, iv:S.iv, qlist:S.qlist, slist:S.slist}; }
function pushNav(){ try{ history.pushState({tou:1}, ''); }catch(e){} }
function go(s){
  if(!S.hist) S.hist=[];
  if(s in HUB_PARENT) S.hist = HUB_PARENT[s] ? [{...snap(), screen:HUB_PARENT[s]}] : [];
  else S.hist.push(snap());
  // Drop focus first: a phone keyboard still open from the last field can leave the
  // new screen scrolled down, with the Back button hidden off the top.
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  S.screen=s; render(); window.scrollTo(0,0); pushNav();
}
// Is there anywhere to go back to from here?
const isGameScreen=()=>GAMES.some(g=>g.id===S.screen);
function canGoBack(){
  if(isGameScreen()) return true;
  if(S.screen==='interview' && S.qi>0) return true;
  if(S.screen==='story' && S.si>0) return true;
  return !!(S.hist && S.hist.length);
}
function goBack(){
  // From inside any game, back always means the game menu (same as "Back to games").
  if(isGameScreen()){
    const hub = S.game&&S.game.target==='them' ? 'themmenu' : 'menu';
    S.hist = HUB_PARENT[hub] ? [{...snap(), screen:HUB_PARENT[hub]}] : [];
    S.screen=hub; render(); window.scrollTo(0,0); return;
  }
  if(S.screen==='interview' && S.qi>0){ S.qi--; render(); return; }
  if(S.screen==='story' && S.si>0){ S.si--; render(); return; }
  const prev = S.hist && S.hist.pop(); if(!prev) return;
  Object.assign(S, prev); render(); window.scrollTo(0,0);
}
// Buttons go through the browser history so the phone's back gesture stays in step.
function backClick(){ if(canGoBack()) history.back(); }
window.addEventListener('popstate', ()=>{ if(canGoBack()) goBack(); });
// A forward step inside the questions (no screen change) still needs a history
// entry, so the phone's back gesture steps back one question too.
function stepForward(){ render(); window.scrollTo(0,0); pushNav(); }

function enc(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function dec(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');const o=JSON.parse(decodeURIComponent(escape(atob(s))));if(o&&(o.a||o.s))return o;}catch(e){}return null;}
function makeLink(){
  const payload={n:getName('me'),a:getAns('me'),s:getStories('me'),c:S.outConsent?1:0};
  const me=S.people['me']||{};
  if(me.toName) payload.t=me.toName;   // what I call them, so they get greeted by name
  if(me.circle) payload.g=me.circle;   // the circle is symmetric: their reply can skip the question
  if(S.people['them']) payload.o={n:getName('them'),a:getAns('them'),s:getStories('them')}; // echo back so they get the full keepsake
  return location.origin+location.pathname+'#play='+enc(payload);
}
function readIncoming(){const m=(location.hash||'').match(/play=([^&]+)/); if(m){const p=dec(m[1]); if(p)return p;} return null;}

// Letter-grid form of an answer: strip accents, spaces and punctuation, uppercase.
// So "Fourth of July" -> "FOURTHOFJULY", "Día de Muertos" -> "DIADEMUERTOS".
function gridWord(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,''); }
// Answers usable by the crossword. Each carries BOTH the display form (a, what
// they typed) and the grid form (word). Multi-word answers are welcome; only the
// letter-run length is bounded.
function wordAnswers(id){const a=getAns(id);
  return QUESTIONS.map(q=>{const raw=(a[q.id]||'').trim(); return {q, a:raw, word:gridWord(raw)};})
    .filter(x=>x.word.length>=2 && x.word.length<=12);}

/* ===================== CROSSWORD ENGINE =====================
   Greedy criss-cross of the person's single-word answers, scored to stay compact
   and square (phone-friendly). entries: [{word, q}]. Returns {placed, rows, cols,
   cells} where cells is a Map "r,c" -> {sol, num?} and each placed entry has
   {word, q, r, c, dir:'A'|'D', cells:[[r,c]...], num}. */
function buildCrossword(entries, opts){
  const key=(r,c)=>r+','+c;
  let base=entries.map(e=>({...e, word:String(e.word).toUpperCase().replace(/[^A-Z]/g,'')}))
    .filter(e=>e.word.length>=3 && e.word.length<=12);
  const seen=new Set(); base=base.filter(e=> seen.has(e.word)?false:(seen.add(e.word),true));
  if(!base.length) return {placed:[], rows:0, cols:0, cells:new Map(), fit:0, total:0};
  const fit=(grid,word,r,c,dir)=>{ const st=dir==='A'?[0,1]:[1,0], pp=dir==='A'?[1,0]:[0,1];
    if(grid.has(key(r-st[0],c-st[1]))) return -1;
    if(grid.has(key(r+st[0]*word.length,c+st[1]*word.length))) return -1;
    let x=0;
    for(let k=0;k<word.length;k++){ const rr=r+st[0]*k, cc=c+st[1]*k, ex=grid.get(key(rr,cc));
      if(ex!==undefined){ if(ex!==word[k]) return -1; x++; }
      else { if(grid.has(key(rr+pp[0],cc+pp[1]))||grid.has(key(rr-pp[0],cc-pp[1]))) return -1; } }
    return x; };
  // One greedy criss-cross from a given word order. Words that can't connect this
  // time around are left out; we run this many times and keep the fullest layout.
  const attempt=(order)=>{
    const grid=new Map(), placed=[]; let bb={minR:0,minC:0,maxR:0,maxC:0};
    const place=(it,r,c,dir)=>{ const st=dir==='A'?[0,1]:[1,0], cells=[];
      for(let k=0;k<it.word.length;k++){ const rr=r+st[0]*k, cc=c+st[1]*k; grid.set(key(rr,cc),it.word[k]); cells.push([rr,cc]); }
      placed.push({word:it.word, q:it.q, r, c, dir, cells}); };
    const updBB=p=>p.cells.forEach(([r,c])=>{ bb.minR=Math.min(bb.minR,r);bb.minC=Math.min(bb.minC,c);bb.maxR=Math.max(bb.maxR,r);bb.maxC=Math.max(bb.maxC,c); });
    const cost=(word,r,c,dir)=>{ const st=dir==='A'?[0,1]:[1,0], er=r+st[0]*(word.length-1), ec=c+st[1]*(word.length-1);
      const h=Math.max(bb.maxR,r,er)-Math.min(bb.minR,r,er)+1, w=Math.max(bb.maxC,c,ec)-Math.min(bb.minC,c,ec)+1;
      return {maxd:Math.max(h,w), skew:Math.abs(h-w)}; };
    place(order[0],0,0,'A'); updBB(placed[0]);
    const pend=order.slice(1);
    for(let pass=0; pass<8 && pend.length; pass++){
      for(let pi=0; pi<pend.length; pi++){ const it=pend[pi]; let best=null;
        for(const p of placed){ for(let k=0;k<p.cells.length;k++){ const [pr,pc]=p.cells[k], L=grid.get(key(pr,pc));
          for(let i=0;i<it.word.length;i++){ if(it.word[i]!==L) continue;
            for(const dir of (p.dir==='A'?['D']:['A'])){ const st=dir==='A'?[0,1]:[1,0], r=pr-st[0]*i, c=pc-st[1]*i, sc=fit(grid,it.word,r,c,dir);
              if(sc>0){ const b=cost(it.word,r,c,dir);
                const better = !best || b.maxd<best.b.maxd || (b.maxd===best.b.maxd && b.skew<best.b.skew) || (b.maxd===best.b.maxd && b.skew===best.b.skew && sc>best.sc);
                if(better) best={r,c,dir,sc,b}; } } } } }
        if(best){ place(it,best.r,best.c,best.dir); updBB(placed[placed.length-1]); pend.splice(pi,1); pi--; } }
    }
    let mnR=Infinity,mnC=Infinity,mxR=-Infinity,mxC=-Infinity;
    for(const k of grid.keys()){ const [r,c]=k.split(',').map(Number); mnR=Math.min(mnR,r);mnC=Math.min(mnC,c);mxR=Math.max(mxR,r);mxC=Math.max(mxC,c); }
    const rows=mxR-mnR+1, cols=mxC-mnC+1;
    return {grid, placed, area:rows*cols, md:Math.max(rows,cols)};
  };
  // Try the longest-first order plus many shuffles; keep the run that places the
  // MOST words, then the DENSEST (smallest bounding-box area, tie smallest side).
  // Density is what keeps the grid from looking sprawling/embarrassing.
  const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  let bestRun=null;
  // PHONE (r20, layout D): pack the puzzle to at most maxW squares WIDE so every column
  // shows at a readable size on a phone; the grid then scrolls up and down instead.
  // Randomised greedy with a time budget; keeps the run that places every word with the
  // smallest area. If nothing fits that narrow, widen by one and try again.
  if(opts&&opts.maxW){
    const narrow=(order,maxW)=>{
      const grid=new Map(), placed=[]; const bb={a:0,b:0,c:0,d:0};
      const place=(it,r,c,dir)=>{ const st=dir==='A'?[0,1]:[1,0], cells=[];
        for(let k=0;k<it.word.length;k++){ const rr=r+st[0]*k, cc=c+st[1]*k; grid.set(key(rr,cc),it.word[k]); cells.push([rr,cc]);
          bb.a=Math.min(bb.a,rr); bb.b=Math.min(bb.b,cc); bb.c=Math.max(bb.c,rr); bb.d=Math.max(bb.d,cc); }
        placed.push({word:it.word, q:it.q, r, c, dir, cells}); };
      place(order[0],0,0, order[0].word.length>maxW||Math.random()<.5?'D':'A');
      const pend=order.slice(1);
      for(let pass=0; pass<10 && pend.length; pass++){
        for(let pi=0; pi<pend.length; pi++){ const it=pend[pi], opts2=[];
          for(const p of placed){ for(let k=0;k<p.cells.length;k++){ const [pr,pc]=p.cells[k], L=grid.get(key(pr,pc));
            for(let i=0;i<it.word.length;i++){ if(it.word[i]!==L) continue;
              const dir=p.dir==='A'?'D':'A', st=dir==='A'?[0,1]:[1,0], r=pr-st[0]*i, c=pc-st[1]*i, sc=fit(grid,it.word,r,c,dir);
              if(sc>0){ const er=r+st[0]*(it.word.length-1), ec=c+st[1]*(it.word.length-1);
                const h=Math.max(bb.c,er)-Math.min(bb.a,r)+1, w=Math.max(bb.d,ec)-Math.min(bb.b,c)+1;
                if(w<=maxW) opts2.push({r,c,dir,s:h*w-sc*3+Math.random()*6}); } } } }
          if(opts2.length){ opts2.sort((x,y)=>x.s-y.s); const o=opts2[Math.random()<.7?0:Math.floor(Math.random()*Math.min(3,opts2.length))];
            place(it,o.r,o.c,o.dir); pend.splice(pi,1); pi--; } } }
      return {grid, placed, rows:bb.c-bb.a+1, cols:bb.d-bb.b+1};
    };
    const t0=Date.now();
    for(let w=opts.maxW; w<=opts.maxW+3 && !bestRun; w++){
      for(let t=0; t<1500 && Date.now()-t0<450; t++){
        const order=shuffle([...base]); if(t%3===0) order.sort((a,b)=>b.word.length-a.word.length);
        const run=narrow(order,w); if(run.placed.length<base.length) continue;
        run.area=run.rows*run.cols;
        if(!bestRun || run.area<bestRun.area || (run.area===bestRun.area && run.rows<bestRun.rows)) bestRun=run; } }
  }
  const orders=bestRun?[]:[ [...base].sort((a,b)=>b.word.length-a.word.length) ];
  if(!bestRun) for(let t=0;t<140;t++) orders.push(shuffle([...base]));
  for(const order of orders){ const run=attempt(order);
    const better = !bestRun || run.placed.length>bestRun.placed.length
      || (run.placed.length===bestRun.placed.length && (run.area<bestRun.area || (run.area===bestRun.area && run.md<bestRun.md)));
    if(better) bestRun=run; }
  const {grid, placed}=bestRun;
  let minR=Infinity,minC=Infinity,maxR=-Infinity,maxC=-Infinity;
  for(const k of grid.keys()){ const [r,c]=k.split(',').map(Number); minR=Math.min(minR,r);minC=Math.min(minC,c);maxR=Math.max(maxR,r);maxC=Math.max(maxC,c); }
  const cells=new Map(), norm=[];
  for(const p of placed){ const np={...p, r:p.r-minR, c:p.c-minC, cells:p.cells.map(([r,c])=>[r-minR,c-minC])};
    norm.push(np); np.cells.forEach(([r,c],k)=> cells.set(key(r,c), {sol:p.word[k]})); }
  const starts=[...new Set(norm.map(p=>key(p.cells[0][0],p.cells[0][1])))].map(k=>{const [r,c]=k.split(',').map(Number);return {r,c,k};}).sort((a,b)=>a.r-b.r||a.c-b.c);
  const num=new Map(); starts.forEach((s,i)=>{ num.set(s.k,i+1); cells.get(s.k).num=i+1; });
  norm.forEach(p=> p.num=num.get(key(p.cells[0][0],p.cells[0][1])));
  return {placed:norm, rows:maxR-minR+1, cols:maxC-minC+1, cells, fit:norm.length, total:base.length};
}

/* ===================== ROUTER ===================== */
/* ===================== GAME REGISTRY (the pluggable engine) =====================
   Each game is ONE entry below. To add a game: (1) write its scr* render function
   (it reads S.game.target, draws into `app`, and calls the shared hooks
   showReveal()/celebrate() for the fact-reveal + "alive" animation); (2) add any
   module-global state var; (3) append an entry here with its id/name/canPlay/
   render/reset. The menu (gameButtons), the router (ROUTES), and resetGames() all
   build themselves from this list, so nothing else needs touching.
     id      screen + S.game.type (must be unique)
     name    menu label (may contain HTML entities)
     blurb   one plain line saying what you actually do (always shown)
     featured  the one coloured/top button (else ghost)
     kind    'game' = a playable game; 'stories' = the conversation surface
     canPlay(p)  enough of person p's data to offer it?  (p is 'p1'|'p2'|'them')
     render  the scr* function
     reset   null out its module state (called by resetGames)

   THE ORDER IS THE POINT. There are only ever ~15 answers, so discovery is spent
   ONCE: the crossword is where you work them out (crossing letters give you real
   information to reason with, which is why it is the only game that is fun to play
   blind). Everything after it is RECALL, and gets better for it. Do not add another
   "guess the answer" game here; there is nothing left to guess by then. */
const GAMES = [
  { id:'crossword',  name:'Crossword',                    featured:true, kind:'game',
    blurb:'Work out their answers, one crossing letter at a time.',
    canPlay:p=>wordAnswers(p).length>=5,             render:scrCrossword,  reset:()=>{ XW=null; } },
  { id:'quiz',       name:'How well were you listening?',  kind:'game',
    blurb:'See how many of their answers you can remember.',
    canPlay:p=>answeredCount(p)>=3,                  render:scrQuiz,       reset:()=>{ QZ=null; } },
  { id:'memory',     name:'Memory Match',                  kind:'game',
    blurb:'Turn over cards to pair each question with what they said.',
    canPlay:p=>answeredCount(p)>=3,                  render:scrMemory,     reset:()=>{ MM=null; } },
  { id:'storyview',  name:'Their stories',                 kind:'stories',
    blurb:'The longer answers, in their own words.',
    canPlay:p=>STORIES.some(s=>getStories(p)[s.id]), render:scrStoryView,  reset:()=>{} },
];
const ROUTES = {
  home:scrHome, mode_local_names:scrLocalNames, whoto:scrWhoTo, tierpick:scrTierPick, packpick:scrPackPick, interview:scrInterview,
  story:scrStory, handoff:scrHandoff, bridge:scrBridge, menu:scrMenu, themmenu:scrThemMenu,
  done:scrDone, remote_start:scrRemoteStart, link:scrLink, received:scrReceived, reply_intro:scrReplyIntro, review:scrReview
};
GAMES.forEach(g=>{ ROUTES[g.id]=g.render; });
// Setup and in-between screens get a top-left Back. Games keep their own
// "Back to games"; the questions and stories have "Go back" beside Next.
const BACK_SCREENS = new Set(['mode_local_names','remote_start','whoto','tierpick','packpick','review',
  'link','handoff','bridge','themmenu','reply_intro','done']);
function render(){
  app.setAttribute('data-screen', S.screen); (ROUTES[S.screen]||scrHome)();
  if(BACK_SCREENS.has(S.screen) && canGoBack()){
    app.insertAdjacentHTML('afterbegin', `<button class="navback" id="navback" aria-label="Go back">&lsaquo; Back</button>`);
    document.getElementById('navback').onclick=backClick;
  }
}

/* ===================== SCREENS ===================== */
function scrHome(){
  const incoming=readIncoming();
  if(incoming){
    S.people['them']={name:incoming.n||'A friend', answers:incoming.a||{}, stories:incoming.s||{},
      consent:incoming.c?true:false, circle:incoming.g||null, callsMe:incoming.t||null};
    if(incoming.o){ S.people['me']={name:incoming.o.n||'Me', answers:incoming.o.a||{}, stories:incoming.o.s||{}}; } // my own data echoed back to me
    return scrReceived();
  }
  app.innerHTML=`
    <div class="center" style="margin:18px 0 26px">
      <div class="eyebrow">A game for two</div>
      <h1 style="margin-top:8px">Two of Us</h1>
      <p class="lead" style="max-width:560px;margin:14px auto 0">
        Answer a few questions about your life. They become a puzzle for someone you love to solve,
        and a reason to talk.</p></div>
    <div class="stack">
      <div class="modecard"><h3>Someone far away</h3>
        <p style="margin:8px 0 16px" class="hint">Answer your questions, then send a link. They play it wherever they are,
          and send one back. Lovely alongside a phone call.</p>
        <button class="btn-teal" id="remote">Start one to send</button></div>
      <div class="modecard"><h3>Together, in person</h3>
        <p style="margin:8px 0 16px" class="hint">Both of you here? Pass one device back and forth.</p>
        <button class="btn-ghost" id="local">Play on this device</button></div>
    </div>`;
  document.getElementById('remote').onclick=()=>go('remote_start');
  document.getElementById('local').onclick=()=>go('mode_local_names');
}

function scrLocalNames(){
  app.innerHTML=`
    <div class="center" style="margin:10px 0 22px"><h2>Who's playing today?</h2></div>
    <div class="card stack">
      <div><div class="pill pill-teal" style="margin-bottom:8px">First player</div>
        <input id="n1" type="text" placeholder="Their first name" value="${esc(typedName('p1','Player 1'))}"></div>
      <div><div class="pill pill-rose" style="margin-bottom:8px">Second player</div>
        <input id="n2" type="text" placeholder="Their first name" value="${esc(typedName('p2','Player 2'))}"></div>
      <button class="btn-teal" id="go">Start with the first player</button></div>`;
  document.getElementById('go').onclick=()=>{
    // Came back here to fix a name? Keep everything already answered.
    const keep=(id,n)=>S.people[id]?Object.assign(S.people[id],{name:n}):{name:n,answers:{},stories:{}};
    S.people={p1:keep('p1',document.getElementById('n1').value.trim()||'Player 1'),
              p2:keep('p2',document.getElementById('n2').value.trim()||'Player 2')};
    S.iv={slot:'p1',color:'teal',next:'handoff'}; go('whoto');
  };
}

function scrTierPick(){
  const slot=S.iv.slot, color=S.iv.color, name=getName(slot);
  const cards=Object.entries(TIERS).map(([id,t])=>`
    <div class="modecard"><h3>${t.name}</h3>
      <p style="margin:8px 0 16px" class="hint">${t.note}</p>
      <button class="btn-${color}" data-tier="${id}">${t.btn}</button></div>`).join('');
  app.innerHTML=`
    <div class="center" style="margin:10px 0 18px">
      <div class="pill pill-${color}">${name}</div>
      <h2 style="margin-top:10px">How old are you?</h2>
      <p class="hint" style="max-width:560px;margin:8px auto 0">We'll pick questions that fit.</p></div>
    <div class="stack">${cards}</div>`;
  app.querySelectorAll('button[data-tier]').forEach(b=>b.onclick=()=>chooseTier(b.dataset.tier));
}
/* Who you are sharing with. Remote asks for a NAME too (whatever they call them:
   "Gramps", "Bruce", a nickname, it does not matter) because it is the only thing
   the sender ever tells us about the receiver, and it becomes the receiver's
   greeting. Local already collected both names on the name screen, so it only asks
   the circle. The circle is SYMMETRIC (if I am your family, you are mine), so it is
   asked ONCE per game: p2 inherits p1's, and a reply inherits the sender's. */
function scrWhoTo(){
  const slot=S.iv.slot, color=S.iv.color, name=getName(slot);
  const remote = S.iv.next==='link';
  const known = (S.people[slot]&&S.people[slot].toName)     // typed already, then came back
    || (remote && S.people['them'] ? getName('them') : '');  // a reply: we already know who it goes back to
  const circles=CIRCLES.map(c=>`
    <button class="btn-ghost game-btn rel-btn" data-circle="${c.id}">
      <span class="game-name">${c.label}</span>
      <span class="game-blurb">${c.blurb}</span></button>`).join('');
  const nameField = remote ? `
    <div class="card" style="margin-bottom:20px">
      <label for="toname" style="display:block; font-size:1.1rem; margin-bottom:10px">What do you call them?</label>
      <input id="toname" type="text" placeholder="Gramps, Bruce, Mom" value="${esc(known)}" autocapitalize="words">
      <p class="hint" style="margin:10px 0 0">However you say it. A name, a nickname, whatever they answer to.
        We use it to say hello when they open your puzzle.</p></div>` : '';
  app.innerHTML=`
    <div class="center" style="margin:10px 0 14px">
      <div class="pill pill-${color}">${name}</div>
      <h2 style="margin-top:10px">${remote?'Who are you sending this to?':'How do you two know each other?'}</h2>
      <p class="hint" style="max-width:520px;margin:8px auto 0">This adds a couple of story prompts made for the two of you.</p></div>
    ${nameField}
    <div class="rel-list">${circles}</div>`;
  app.querySelectorAll('button[data-circle]').forEach(b=>b.onclick=()=>chooseCircle(b.dataset.circle));
}
function chooseCircle(id){
  const slot=S.iv.slot, f=document.getElementById('toname');
  if(f){ const t=f.value.trim(); if(t) S.people[slot].toName=t; }
  S.people[slot].circle=id; S.iv.circle=id; go('tierpick');
}

function chooseTier(id){
  const tier=TIERS[id]||TIERS.adult;
  S.people[S.iv.slot].tier=id;
  S.qlist=[...tier.q].map(qById).filter(Boolean); // exactly the tier's 15; relationship adds story prompts only
  S.qi=0; S.si=0;
  if(id==='adult'){
    go('packpick');
  } else {
    S.slist=[...tier.s, ...circleStoryIds(S.iv.circle)].map(sById).filter(Boolean);
    go('interview');
  }
}
function scrPackPick(){
  const color=S.iv.color;
  const cards=PACKS.map(pk=>`
    <div class="modecard"><h3>${pk.name}</h3>
      <p style="margin:8px 0 16px" class="hint">${pk.blurb}</p>
      <button class="btn-${color}" data-pk="${pk.id}">Choose this set</button></div>`).join('');
  app.innerHTML=`
    <div class="center" style="margin:10px 0 18px">
      <div class="eyebrow">Pick a set of questions</div>
      <h2 style="margin-top:6px">What would you like to talk about?</h2>
      <p class="hint" style="max-width:560px;margin:8px auto 0">Pick a few questions or the whole lot, plus a story or two to share if you'd like. The more you answer, the bigger the puzzle. There are no wrong answers.</p></div>
    <div class="stack">${cards}</div>`;
  app.querySelectorAll('button[data-pk]').forEach(b=>b.onclick=()=>choosePack(b.dataset.pk));
}
function choosePack(id){
  const pk=PACKS.find(x=>x.id===id)||PACKS[0];
  S.slist=[...pk.s, ...circleStoryIds(S.iv.circle)].map(sById).filter(Boolean);
  go('interview');
}

function scrRemoteStart(){
  const reply = S.people['them'] ? true : false;
  app.innerHTML=`
    <div class="center" style="margin:10px 0 18px">
      <div class="eyebrow">${reply?'Your turn':'Step one'}</div>
      <h2 style="margin-top:6px">${reply?'A little about you':'First, a little about you'}</h2>
      <p class="hint">You'll answer a few questions, then we'll make a link to send.</p></div>
    <div class="card stack">
      <div class="pill pill-teal" style="margin-bottom:4px">Your name</div>
      <input id="n" type="text" placeholder="Your first name" value="${esc(S.people['me']&&S.people['me'].draft?typedName('me','Me'):'')}">
      <button class="btn-teal" id="go">Begin my questions</button></div>`;
  document.getElementById('go').onclick=()=>{
    const n=document.getElementById('n').value.trim()||'Me';
    // `draft` marks answers typed in THIS session, so coming back to fix your name keeps
    // them. A reply link can also carry an echoed old copy of "me" (no draft flag); that
    // one is replaced, not reused.
    const old=S.people['me'];
    S.people['me'] = old&&old.draft ? Object.assign(old,{name:n}) : {name:n,answers:{},stories:{},draft:true};
    S.iv={slot:'me',color:'teal',next:'link'};
    // Replying: we already know who it goes back to (their name came in the link) and
    // the circle is symmetric, so don't ask either question again. Older links carry no
    // circle, so those still ask, with the name prefilled.
    const th=S.people['them'];
    if(reply && th && th.circle){
      S.people['me'].toName=th.name; S.people['me'].circle=th.circle; S.iv.circle=th.circle;
      return go('tierpick');
    }
    go('whoto');
  };
}

function scrInterview(){
  const slot=S.iv.slot, color=S.iv.color, list=S.qlist, q=list[S.qi];
  const dots=list.map((_,i)=>`<span class="dot ${i<=S.qi?'on':''} ${color==='rose'?'rose':''}"></span>`).join('');
  app.innerHTML=`
    <div class="center" style="margin:10px 0 14px">
      <div class="pill pill-${color}">${getName(slot)}</div>
      <div class="dots" style="margin-top:14px">${dots}</div>
      <p class="hint" style="margin:4px 0 0">Question ${S.qi+1} of ${list.length}</p></div>
    <div class="card stack">
      <h2>${q.ask}</h2>
      <div id="ans" class="ans-input sc" contenteditable="true" data-ph="Type your answer" spellcheck="false" autocapitalize="words">${esc(getAns(slot)[q.id]||'')}</div>
      <div class="btn-row">
        ${canGoBack()?`<button class="btn-ghost" id="back">Go back</button>`:``}
        <button class="btn-${color}" id="next">${S.qi<list.length-1?'Next question':'Next'}</button></div>
      <p class="hint center" style="margin:0">No wrong answers. A word or two is plenty.</p>
      <p class="hint center" data-spellstatus style="margin:6px 0 0; font-size:.82rem; opacity:.75">${spellStatusText()}</p></div>`;
  const inp=document.getElementById('ans'); paintSpell(inp); inp.focus(); setCaret(inp,(inp.textContent||'').length);
  const save=()=>{const v=inp.textContent.trim(); if(v)S.people[slot].answers[q.id]=v; else delete S.people[slot].answers[q.id];};
  inp.addEventListener('input',()=>{ save(); paintSpell(inp); });
  document.getElementById('next').onclick=()=>{save(); if(S.qi<list.length-1){S.qi++;stepForward();} else startStories();};
  if(document.getElementById('back')) document.getElementById('back').onclick=()=>{save();backClick();};
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('next').click();}};
}
function startStories(){ if(S.slist&&S.slist.length){S.si=0;go('story');} else go('review'); }
function scrStory(){
  const slot=S.iv.slot, color=S.iv.color, list=S.slist, s=list[S.si];
  if(!S.people[slot].stories)S.people[slot].stories={};
  app.innerHTML=`
    <div class="center" style="margin:10px 0 14px">
      <div class="pill pill-${color}">${getName(slot)}</div>
      <p class="hint" style="margin:10px 0 0">A story to share, if you'd like (${S.si+1} of ${list.length})</p></div>
    <div class="card stack">
      <h2>${s.ask}</h2>
      <textarea id="ans" class="linkbox" spellcheck="true" style="border-style:solid;border-color:var(--line);font-family:var(--body);font-size:1.15rem;word-break:normal;min-height:130px" placeholder="A sentence or two is plenty. Or skip it.">${esc(getStories(slot)[s.id]||'')}</textarea>
      <div class="btn-row">
        ${canGoBack()?`<button class="btn-ghost" id="back">Go back</button>`:``}
        <button class="btn-ghost" id="skip">Skip this one</button>
        <button class="btn-${color}" id="next">${S.si<list.length-1?'Next':'All done'}</button></div></div>`;
  const inp=document.getElementById('ans'); inp.focus();
  const save=()=>{const v=inp.value.trim(); if(v)S.people[slot].stories[s.id]=v; else delete S.people[slot].stories[s.id];};

  document.getElementById('skip').onclick=()=>{inp.value='';save();advanceStory();};
  if(document.getElementById('back')) document.getElementById('back').onclick=()=>{save();backClick();};
}
function advanceStory(){ if(S.si<S.slist.length-1){S.si++;stepForward();} else go('review'); }

function scrLink(){
  const link=S.link;
  const me=getName('me');
  const note="Hi, it's "+me+". I made you a little game about my life so you can get to know me better. It is private, just between us, and nothing is stored anywhere. Open this to start playing: ";
  const smsBody=encodeURIComponent(note+link);
  const mailBody=encodeURIComponent(note+link);
  const mailSubj=encodeURIComponent("A little game from "+me);
  // Build the scan code first. Only show it when it is coarse enough to actually
  // read off a phone screen (a long reply that echoes both people balloons past
  // what a camera can lock onto, so we steer those to the link instead).
  let qrSvg='';
  try{
    const q=qrcode(0,'L'); q.addData(S.link); q.make();
    if(q.getModuleCount()<=97) qrSvg=q.createSvgTag({cellSize:4,margin:16,scalable:true});
  }catch(e){ qrSvg=''; }
  const qrBlock = qrSvg ? `
      <div class="share-way">
        <h3><span class="num">1</span>Together right now?</h3>
        <p class="hint" style="margin:8px 0 0">Open the camera on their phone and point it at this square. Their phone offers
          to open the game. No typing, no long web address to read.</p>
        <div class="qrframe">${qrSvg}</div>
      </div>` : '';
  const farNum = qrSvg ? '2' : '1';
  const farHead = qrSvg ? 'Far apart?' : 'Send it to them';
  const farLead = qrSvg ? 'Send them the link instead. ' : '';
  app.innerHTML=`
    <div class="center" style="margin:10px 0 16px">
      <div class="eyebrow">Step two</div><h2 style="margin-top:6px">Send it to someone you love</h2>
      <p class="hint" style="max-width:560px;margin:8px auto 0">When they open it, they play a game and learn about you,
        then they can send one back about themselves.</p></div>
    <div class="card stack">
      ${qrBlock}
      <div class="share-way">
        <h3><span class="num">${farNum}</span>${farHead}</h3>
        <p class="hint" style="margin:8px 0 12px">${farLead}The message says it is from <b>${me}</b>, so they know it is really you.</p>
        <div class="btn-row">
          <a class="btn btn-teal" href="sms:?&body=${smsBody}">Send by text</a>
          <a class="btn btn-ghost" href="mailto:?subject=${mailSubj}&body=${mailBody}">Send by email</a></div>
        <button class="btn-ghost" id="copy" style="margin-top:12px">Or copy the link</button>
        <textarea class="linkbox" id="lb" readonly style="margin-top:12px">${link}</textarea>
      </div>
      <label style="display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:1.05rem;border-top:1px solid var(--line);padding-top:16px">
        <input type="checkbox" id="consent" ${S.outConsent?'checked':''} style="width:26px;height:26px;margin-top:2px;flex:0 0 auto">
        <span>I'm open to keeping a keepsake of this. It is only ever saved if you <b>both</b> agree, and only as a file on your own device.</span></label>
      <p class="hint center" id="msg" style="margin:0">Your answers travel inside the link and the code itself. Nothing is stored anywhere.</p>
      <button class="btn-ghost" id="cont">Continue</button></div>`;
  document.getElementById('copy').onclick=async()=>{
    try{await navigator.clipboard.writeText(S.link);}catch(e){const t=document.getElementById('lb');t.select();document.execCommand('copy');}
    document.getElementById('msg').textContent='Copied. Now paste it into a text or email.';
  };
  document.getElementById('consent').onchange=e=>{ S.outConsent=e.target.checked; S.link=makeLink(); render(); };

/* ---------- QUIZ ----------
   The RECALL half of the arc. Played cold this is a 1-in-4 coin flip, but played
   after the crossword it is the real thing: a test of whether you were actually
   paying attention to them. Hence the score, and the "listening" framing. */
let QZ=null;
function scrQuiz(){
  const p=S.game.target;
  if(!QZ||QZ.for!==p){QZ={for:p,list:QUESTIONS.filter(q=>getAns(p)[q.id]),i:0,score:0,picked:null,options:null};}
  if(QZ.i>=QZ.list.length)return quizDone(p);
  const q=QZ.list[QZ.i], correct=getAns(p)[q.id];
  if(!QZ.options){const ds=q.distractors.filter(d=>d.toLowerCase()!==correct.toLowerCase());
    QZ.options=[correct,...ds.sort(()=>Math.random()-0.5).slice(0,3)].sort(()=>Math.random()-0.5);}
  app.innerHTML=`
    <div class="center" style="margin:6px 0 12px">
      <div class="pill pill-teal">How well were you listening to ${getName(p)}?</div>
      <p class="hint" style="margin-top:10px">Question ${QZ.i+1} of ${QZ.list.length}</p></div>
    <div class="card stack"><h2>${q.reveal.replace('{n}',getName(p))}…?</h2>
      <div id="opts" class="stack"></div><div id="qreveal"></div></div>`;
  const box=document.getElementById('opts');
  QZ.options.forEach(opt=>{const b=document.createElement('button');b.className='btn-ghost';b.textContent=opt;
    b.onclick=()=>quizPick(opt,correct,q,p);box.appendChild(b);});
}
function quizPick(opt,correct,q,p){
  if(QZ.picked)return; QZ.picked=opt; const right=opt.toLowerCase()===correct.toLowerCase(); if(right)QZ.score++;
  document.querySelectorAll('#opts button').forEach(b=>{b.disabled=true;
    if(b.textContent.toLowerCase()===correct.toLowerCase())b.classList.add('btn-teal');
    else if(b.textContent===opt)b.style.opacity=.5;});
  document.getElementById('qreveal').innerHTML=`
    <div class="reveal" style="margin-top:6px"><div class="label">${right?'You knew it':'Now you know'}</div>
      <div class="ans">${q.reveal.replace('{n}',getName(p))} ${correct}.</div>
      <div class="talk"><b>${talkLead()}:</b> ${q.talk}</div></div>
    <button class="btn-amber" id="qnext" style="margin-top:16px">${QZ.i<QZ.list.length-1?'Next':'See how you did'}</button>`;
  document.getElementById('qnext').onclick=()=>{QZ.i++;QZ.options=null;QZ.picked=null;render();};
}
function quizDone(p){
  const n=QZ.list.length, s=QZ.score, name=getName(p), pct=n?s/n:0;
  // Never a failing grade. A low score is a reason to talk to them, not a telling-off.
  let head, lead;
  if(s===n)          { head='Every single one.';   lead=`You were paying attention to ${name}.`; }
  else if(pct>=0.7)  { head=`${s} out of ${n}.`;   lead='You were listening.'; }
  else if(pct>=0.4)  { head=`${s} out of ${n}.`;   lead=`Some of ${name} you had, some of it is still new.`; }
  else               { head=`${s} out of ${n}.`;   lead=`Plenty left to ask ${name} about.`; }
  app.innerHTML=`<div class="card center stack" style="margin-top:20px">
      <div class="eyebrow">All done</div><h2>${head}</h2>
      <p class="lead">${lead}</p>
      <button class="btn-amber" id="back">Back to games</button></div>`;
  document.getElementById('back').onclick=()=>{ QZ=null; resetGames(); gameBack(p); };
}

/* ---------- MEMORY MATCH ---------- */
let MM=null;
function scrMemory(){
  const p=S.game.target;
  if(!MM||MM.for!==p){
    const items=QUESTIONS.filter(q=>getAns(p)[q.id]).slice(0,5);
    let cards=[];
    items.forEach(q=>{ cards.push({qid:q.id,kind:'q',text:q.label}); cards.push({qid:q.id,kind:'a',text:getAns(p)[q.id]}); });
    cards=cards.map((c,i)=>({...c,id:i})).sort(()=>Math.random()-0.5);
    MM={for:p,cards,flipped:[],matched:new Set(),lock:false,pairs:items.length};
  }
  const grid=MM.cards.map(c=>{
    const isMatched=MM.matched.has(c.qid), isUp=isMatched||MM.flipped.includes(c.id);
    return `<button class="mem-card ${isUp?'up':''} ${isMatched?'matched':''}" data-id="${c.id}" ${isMatched?'disabled':''}>${isUp?esc(c.text):''}</button>`;
  }).join('');
  app.innerHTML=`
    <div class="center" style="margin:6px 0 12px">
      <div class="pill pill-teal">${getName(p)}</div>
      <h2 style="margin-top:10px">Find the pairs</h2>
      <p class="hint">Tap two cards to match a question with its answer.</p></div>
    <div class="mem-grid">${grid}</div>
    <div id="reveal" style="margin-top:16px"></div>
    <div style="margin-top:16px"><button class="btn-ghost" id="back">Back to games</button></div>`;
  document.getElementById('back').onclick=()=>{MM=null;gameBack(p);};
  app.querySelectorAll('.mem-card').forEach(b=>{ if(!b.disabled) b.onclick=()=>memTap(+b.dataset.id); });
}
function memTap(id){
  if(MM.lock)return;
  const card=MM.cards.find(c=>c.id===id);
  if(MM.flipped.includes(id)||MM.matched.has(card.qid))return;
  MM.flipped.push(id);
  if(MM.flipped.length<2){ render(); return; }
  const [a,b]=MM.flipped.map(fid=>MM.cards.find(c=>c.id===fid));
  if(a.qid===b.qid){
    MM.matched.add(a.qid); MM.flipped=[]; render();
    const q=qById(a.qid);
    showReveal(MM.for,q,getAns(MM.for)[a.qid],MM.pairs,MM.matched.size);
    if(MM.matched.size===MM.pairs) appendAllDone(MM.for);
  } else {
    MM.lock=true; render();
    setTimeout(()=>{ MM.flipped=[]; MM.lock=false; render(); },900);
  }
}

const QCAT=[

  [/sport|team|athlet/,'sport']];
// Theme glyph per category, when the answer itself isn't recognized.
const CAT_THEME={color:'🎨',nature:'🍃',food:'🍽️',animal:'🐾',transport:'🚗',job:'💼',chore:'🧹',
  place:'📍',hobby:'🎯',holiday:'🎉',music:'🎵',subject:'📖',humor:'😂',sport:'🏅',people:'👪',
  name:'🏷️',friend:'🤝',media:'🎬',future:'🎓',secret:'🤫',pride:'🏆',star:'🌟'};
// Order to scan when no question category fits, or for a cross-category answer match.
const CAT_ORDER=['holiday','sport','music','subject','humor','job','chore','hobby','media','future','transport','animal','food','color','nature','place','people'];
// Categories whose answers are PROPER NOUNS or ABSTRACT (a hometown, a person's name,
// a private fact, a thing you're proud of) — don't run them through the object lexicon
// (a town "Cream Ridge", a friend "Rose", or "Grades" shouldn't pop food/flowers/an
// obscure ideograph); lock them to their own theme glyph.
const PROPER={place:1,name:1,friend:1,secret:1,pride:1};
let _xwLastPop=-1;
function catMatch(cat, a){ const list=POP_CATS[cat]; if(!list) return null; for(const [re,g] of list){ if(re.test(a)) return g; } return null; }
// Broad fallback: look each answer word up in the bundled emoji lexicon, with light stemming
// so "running"/"cats"/"baked" still hit "run"/"cat"/"bake".
function lexMatch(a){
  const lex=window.XW_EMOJI; if(!lex) return null;
  for(const w of a.split(/[^a-z]+/)){ if(w.length<3) continue;
    const forms=[w];
    if(w.length>4){ if(w.endsWith('ing')) forms.push(w.slice(0,-3), w.slice(0,-3)+'e');
      if(w.endsWith('ed')) forms.push(w.slice(0,-2), w.slice(0,-1));
      if(w.endsWith('es')) forms.push(w.slice(0,-2));
      if(w.endsWith('s')) forms.push(w.slice(0,-1)); }
    for(const f of forms){ if(lex[f]) return lex[f]; }
  }

}
function popGlyphFor(q, answer){
  const a=(answer||'').toLowerCase();
  const qk=(((q&&q.id)||'')+' '+((q&&q.label)||'')+' '+((q&&q.ask)||'')).toLowerCase();
  let qcat=null; for(const [re,c] of QCAT){ if(re.test(qk)){ qcat=c; break; } }
  // 1) prefer a curated answer match inside the question's own category (the "balance")
  if(qcat){ const m=catMatch(qcat,a); if(m) return m; }
  // Proper-noun answers (hometown, nickname, friend's name, a private fact) never go
  // through the object lexicon — a real in-category word already matched in step 1
  // (lake/beach/...); otherwise lock to the category's own theme glyph.
  if(PROPER[qcat]) return CAT_THEME[qcat];
  // 2) any curated answer match in another category
  for(const cat of CAT_ORDER){ if(cat===qcat) continue; const m=catMatch(cat,a); if(m) return m; }
  // 3) the broad emoji lexicon (covers the long tail: accordion, lobster, ...)
  const lx=lexMatch(a); if(lx) return lx;
  // 4) the question's theme glyph
  if(qcat && CAT_THEME[qcat]) return CAT_THEME[qcat];
  // 5) a warm random glyph, never the same one twice in a row
  let i=Math.floor(Math.random()*XW_POPS.length); if(i===_xwLastPop) i=(i+1)%XW_POPS.length; _xwLastPop=i; return XW_POPS[i];
}
function xwPop(host, q, answer){
  if(!host) return;
  const s=document.createElement('span'); s.className='xw-pop'; s.textContent=popGlyphFor(q, answer);
  host.appendChild(s); setTimeout(()=>{ s.remove(); },1600);
}
function addSparkles(host){
  if(!host) return;
  for(let i=0;i<7;i++){ const s=document.createElement('span'); s.textContent='✦';
    s.style.cssText=`position:absolute; z-index:4; left:${16+Math.random()*68}%; top:${14+Math.random()*68}%; color:var(--amber); font-size:${14+Math.random()*14}px; pointer-events:none; animation:spark .8s ease-out ${i*35}ms both;`;
    host.appendChild(s); setTimeout(()=>s.remove(),1000); }
}
/* Shared "alive" reveal animation (engine hook): blooms an element and scatters
   sparkles over a host. Any game can call it. No-ops under reduced-motion. */
function celebrate(bloomEl, host){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  if(bloomEl) bloomEl.classList.add('bloom');
  addSparkles(host||bloomEl);
}

/* ---------- CROSSWORD ----------
   The person's single-word answers, criss-crossed. Clues are the questions about
   them, so filling it in = working out what they said (the crossing letters help).
   Tap a square, then tap the on-screen letters OR type on a real keyboard. */
let XW=null, _xwKeyHandler=null;
function scrCrossword(){
  const p=S.game.target;
  if(!XW||XW.for!==p){
    // Phones get a puzzle packed 12 squares wide (layout D); computers keep the squarer grid.
    const data=buildCrossword(wordAnswers(p).map(x=>({word:x.word, q:x.q})), xwIsPhone()?{maxW:12}:null);
    const order=[...data.placed].filter(pl=>pl.dir==='A').sort((a,b)=>a.num-b.num)
      .concat([...data.placed].filter(pl=>pl.dir==='D').sort((a,b)=>a.num-b.num));
    XW={for:p, data, order, entry:new Map(), sel:null, solved:new Set(), just:[]};
    const first=order[0];
    if(first) XW.sel={r:first.cells[0][0], c:first.cells[0][1], dir:first.dir};
  }
  renderCrossword(p);
  xwBindKeys(p);   // physical keyboard works too (on-screen pad still works for tap-only)
}
// One document-level keydown listener for the whole crossword session (the on-screen
// pad is wired per-render, but a physical keyboard needs a persistent listener).
function xwBindKeys(p){
  xwUnbindKeys();
  _xwKeyHandler=(e)=>{
    if(S.screen!=='crossword'||!XW){ xwUnbindKeys(); return; }
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    const k=e.key;
    if(/^[a-zA-Z]$/.test(k)){ xwLetter(p,k.toUpperCase()); e.preventDefault(); }
    else if(k==='Backspace'){ xwBackspace(p); e.preventDefault(); }
    else if(k==='ArrowLeft'){ xwMove(p,0,-1); e.preventDefault(); }
    else if(k==='ArrowRight'){ xwMove(p,0,1); e.preventDefault(); }
    else if(k==='ArrowUp'){ xwMove(p,-1,0); e.preventDefault(); }
    else if(k==='ArrowDown'){ xwMove(p,1,0); e.preventDefault(); }
  };
  document.addEventListener('keydown',_xwKeyHandler);
}
function xwUnbindKeys(){ if(_xwKeyHandler){ document.removeEventListener('keydown',_xwKeyHandler); _xwKeyHandler=null; } }
function xwMove(p,dr,dc){
  if(!XW.sel) return; const d=XW.data; let r=XW.sel.r, c=XW.sel.c;
  for(let n=0;n<Math.max(d.rows,d.cols);n++){ r+=dr; c+=dc;
    if(r<0||c<0||r>=d.rows||c>=d.cols) return;
    if(d.cells.get(xwKey(r,c))){
      const dir = dc!==0?'A':'D';
      const has = d.placed.some(pl=>pl.dir===dir && pl.cells.some(([rr,cc])=>rr===r&&cc===c));
      XW.sel={r,c,dir: has?dir:XW.sel.dir}; renderCrossword(p); return;
    }
  }
}
function xwKey(r,c){ return r+','+c; }
function xwActiveWord(){ if(!XW.sel) return null;
  return XW.data.placed.find(pl=> pl.dir===XW.sel.dir && pl.cells.some(([r,c])=>r===XW.sel.r&&c===XW.sel.c)); }
function xwSelect(r,c){
  // Only a clue's first letter lights up its lane. A middle/crossing square just
  // takes the cursor (dir:null → no active word highlight).
  const startA=XW.data.placed.find(pl=>pl.dir==='A'&&pl.cells[0][0]===r&&pl.cells[0][1]===c);
  const startD=XW.data.placed.find(pl=>pl.dir==='D'&&pl.cells[0][0]===r&&pl.cells[0][1]===c);
  if(startA||startD){
    let dir;
    if(XW.sel&&XW.sel.r===r&&XW.sel.c===c){ dir = (XW.sel.dir==='A'&&startD)?'D':(XW.sel.dir==='D'&&startA)?'A':(startA?'A':'D'); } // re-tap toggles when it starts both
    else { dir = startA?'A':'D'; }
    XW.sel={r,c,dir};
  } else {
    if(!XW.data.placed.some(pl=>pl.cells.some(([rr,cc])=>rr===r&&cc===c))) return;
    XW.sel={r,c,dir:null};
  }
}
function xwFirstEmpty(pl){ for(const [r,c] of pl.cells){ if(!XW.entry.get(xwKey(r,c))) return {r,c}; } return {r:pl.cells[0][0], c:pl.cells[0][1]}; }
function xwGoClue(step, onlyUnsolved){
  const aw=xwActiveWord(), L=XW.order.length; if(!L) return;
  let idx=Math.max(0, XW.order.indexOf(aw));
  for(let n=1;n<=L;n++){ const w=XW.order[((idx+step*n)%L+L)%L];
    if(onlyUnsolved && XW.solved.has(XW.data.placed.indexOf(w))) continue;
    const fe=xwFirstEmpty(w); XW.sel={r:fe.r, c:fe.c, dir:w.dir}; return; }
  const w=XW.order[((idx+step)%L+L)%L], fe=xwFirstEmpty(w); XW.sel={r:fe.r, c:fe.c, dir:w.dir};
}
function xwAdvance(){ const aw=xwActiveWord(); if(!aw) return;
  const i=aw.cells.findIndex(([r,c])=>r===XW.sel.r&&c===XW.sel.c);
  if(i>=0 && i+1<aw.cells.length){ const [r,c]=aw.cells[i+1]; XW.sel={r,c,dir:aw.dir}; return; }  // next cell, never skip filled ones (or letters misalign at a crossing)
  if(aw.cells.every(([r,c])=>XW.entry.get(xwKey(r,c)))) xwGoClue(1, true);   // word complete: hop to the next unfinished clue
}
function xwRecompute(){ const now=new Set();
  XW.data.placed.forEach((pl,idx)=>{ if(pl.cells.every(([r,c])=>XW.entry.get(xwKey(r,c))===XW.data.cells.get(xwKey(r,c)).sol)) now.add(idx); });
  XW.just=[...now].filter(idx=>!XW.solved.has(idx)); XW.solved=now;
}
// Some phone keyboards hand over several letters in one go (fast typing, a suggestion
// tapped): place every one of them, in order, and stop if the puzzle gets finished.
function xwTypeAll(p,v){ for(const ch of v.toUpperCase()){ if(!XW||!XW.sel||(XW.solved.size===XW.data.placed.length)) break; xwLetter(p,ch); } }
function xwLetter(p,ch){ if(!XW.sel) return; XW.entry.set(xwKey(XW.sel.r,XW.sel.c),ch); xwRecompute(); xwAdvance(); renderCrossword(p); }
function xwBackspace(p){ if(!XW.sel) return; const k=xwKey(XW.sel.r,XW.sel.c);
  if(XW.entry.get(k)){ XW.entry.delete(k); }
  else { const aw=xwActiveWord(); if(aw){ const i=aw.cells.findIndex(([r,c])=>r===XW.sel.r&&c===XW.sel.c);
    if(i>0){ const [r,c]=aw.cells[i-1]; XW.sel={r,c,dir:aw.dir}; XW.entry.delete(xwKey(r,c)); } } }
  xwRecompute(); renderCrossword(p);
}
function xwHint(p){ if(!XW.sel) return; let k=xwKey(XW.sel.r,XW.sel.c), cell=XW.data.cells.get(k); if(!cell) return;

  if(XW.entry.get(k)===cell.sol){ const aw=xwActiveWord(); if(aw){ const fe=aw.cells.find(([r,c])=>!XW.entry.get(xwKey(r,c)));
    if(fe){ XW.sel={r:fe[0],c:fe[1],dir:aw.dir}; k=xwKey(fe[0],fe[1]); cell=XW.data.cells.get(k); } } }

/* Phone layout D (r20, Lance: "build D into the game"): the layout most phone crossword

   view. The question sits in one bar right above the game's OWN letter keyboard, so the
   phone's keyboard (and its AutoFill bar) never appears and the page never jumps.
   Computers and tablets (wider than 600px) keep the big grid + clue list and type on

function xwIsPhone(){ return window.innerWidth<=600; }
// The word being worked on; a bare cursor square adopts the word through it (across first).
function xwPhoneWord(){
  let aw=xwActiveWord(); if(aw) return aw;
  if(!XW.sel) return null;
  const hits=XW.data.placed.filter(pl=>pl.cells.some(([r,c])=>r===XW.sel.r&&c===XW.sel.c));
  aw=hits.find(pl=>pl.dir==='A')||hits[0]; if(aw) XW.sel.dir=aw.dir; return aw;

// Tap a square: move there. Tap the square you are already on: switch to the word crossing it.
function xwPhonePick(r,c){

// Tapping the question switches between across and down at the same square.

    <div class="xwd-board" id="xwboard"><div class="xw-grid xwd-grid${done?' solved':''}" style="grid-template-columns:repeat(${d.cols},${cs}px); grid-auto-rows:${cs}px; --cs:${cs}px">${g}</div></div>

  const grid=app.querySelector('.xwd-grid'), board=document.getElementById('xwboard');
  // Keep the word in view: scroll the PUZZLE (never the page) from where it was, so it glides.

    const target=Math.max(0, Math.min(mid-board.clientHeight/2, board.scrollHeight-board.clientHeight));

  document.getElementById('back').onclick=()=>{ xwUnbindKeys(); XW=null; resetGames(); gameBack(p); };
  if(done){

    document.getElementById('keep').onclick=()=>{ xwUnbindKeys(); XW=null; go('done'); };
    const tq=document.getElementById('toquiz');
    if(tq) tq.onclick=()=>{ xwUnbindKeys(); XW=null; QZ=null; S.game={type:'quiz',target:p}; go('quiz'); };
    xwUnbindKeys();

function renderCrossword(p){
  const d=XW.data, done=d.placed.length>0 && XW.solved.size===d.placed.length;
  if(xwIsPhone()) return renderCrosswordDock(p);
  const aw=done?null:xwActiveWord();
  const activeSet=new Set(aw? aw.cells.map(([r,c])=>xwKey(r,c)):[]);
  // Render an N x N SQUARE (N = larger of rows/cols), content centered, the extra
  // cells are soft-teal blocks. Logical r,c (data attrs) still drive the game logic.
  const N=Math.max(d.rows,d.cols), offR=Math.floor((N-d.rows)/2), offC=Math.floor((N-d.cols)/2);
  let grid='';
  for(let dr=0;dr<N;dr++) for(let dc=0;dc<N;dc++){ const r=dr-offR, c=dc-offC;
    const inb=r>=0&&r<d.rows&&c>=0&&c<d.cols, k=inb?xwKey(r,c):null, cell=k?d.cells.get(k):null;
    if(!cell){ grid+=`<div class="xw-block"></div>`; continue; }
    const sel=!done&&XW.sel&&XW.sel.r===r&&XW.sel.c===c, letter=XW.entry.get(k)||'';
    const cls=['xw-cell']; if(!done&&activeSet.has(k))cls.push('active'); if(sel)cls.push('cursor');
    grid+=`<div class="${cls.join(' ')}" data-r="${r}" data-c="${c}">${cell.num?`<span class="xw-num">${cell.num}</span>`:''}<span class="xw-let">${letter}</span></div>`;

  const clueText=(q)=>{ const t=CROSSWORD_CLUES[q.id]||q.reveal||q.label; return esc(t.replace(/\{n\}/g,nm)); };
  const cl=(pl)=>`<li class="xw-clue ${XW.solved.has(d.placed.indexOf(pl))?'done':''} ${aw===pl?'cur':''}" data-r="${pl.cells[0][0]}" data-c="${pl.cells[0][1]}" data-dir="${pl.dir}"><b>${pl.num}</b> ${clueText(pl.q)}</li>`;

  // viewport height (capped 52px). Small grids get big cells; a full 15-word grid shrinks to fit.
  const narrow=window.innerWidth<=600;
  const availW=narrow ? window.innerWidth*0.92 : Math.min(window.innerWidth,1180)*0.98 - 300;
  const availH=window.innerHeight - 240;
  const cs=Math.max(20, Math.min(32, Math.floor(Math.min(availW/N, availH/N))));
  // When the puzzle is complete the layout DOES NOT change: same grid, same clues in the
  // same place. Only the strip BELOW the grid swaps (footer -> finish actions, message ->
  // celebration), so nothing jumps.
  // The arc's handoff: discovery is spent, so the finish points at the RECALL game
  // rather than at a menu. Offered only if the quiz can actually run for this person.
  const quizGame=GAMES.find(g=>g.id==='quiz');
  const canQuiz=done && quizGame && quizGame.canPlay(p);
  const foot = done
    ? `<div class="xw-foot" style="flex-direction:column; gap:12px">
         ${canQuiz?`<button class="btn-amber" id="toquiz">Now, how well were you listening?</button>`:''}
         <button class="btn-ghost" id="savepic">Save this puzzle as a picture</button>
         <button class="btn-ghost" id="keep">Keep all our answers</button>
         <div style="display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:2px">
           <button class="xw-back" id="back">Back to games</button></div></div>`
    : `<div class="xw-foot"><button class="xw-hint" id="xwhint">Reveal Letter</button><button class="xw-back" id="back">Back to games</button></div>`;

    <div class="center" style="margin:2px 0 10px">
      <div class="pill pill-teal">Get to know ${esc(getName(p))}</div></div>
    <div class="xw-board">
      <div class="xw-gridwrap"><div class="xw-grid${done?' solved':''}" style="grid-template-columns:repeat(${N},1fr); width:${cs*N}px; --cs:${cs}px">${grid}</div></div>

        <div class="xw-cluecol"><h3>Across</h3><ul>${across}</ul></div>
        <div class="xw-cluecol"><h3>Down</h3><ul>${down}</ul></div>

    ${foot}`;

  // play and finish (same clue panel), so the grid keeps the exact same size when solved.

      const roomW=app.clientWidth - panelEl.getBoundingClientRect().width - 28 - 8;
      const grow=Math.max(cs, Math.min(Math.floor(H/N), Math.floor(roomW/N), Math.floor(availW/N), 64));
      gridEl.style.width=(grow*N)+'px'; gridEl.style.setProperty('--cs', grow+'px');
      gridEl.parentElement.style.width=(grow*N)+'px'; } }   // keep the grid TRACK in sync so the board re-centers correctly

    document.getElementById('keep').onclick=()=>{ xwUnbindKeys(); XW=null; go('done'); };
    const tq=document.getElementById('toquiz');

    document.getElementById('back').onclick=()=>{ xwUnbindKeys(); XW=null; resetGames(); gameBack(p); };
    xwUnbindKeys();   // puzzle solved: stop accepting input

        <div class="label">All filled in</div>
        <div class="ans" style="margin:4px 0 2px">You did it!</div>
        <div class="talk">Every answer worked out. That is the whole of ${esc(nm)} in one little grid.</div></div>`;
    // Whole-grid finale wave (in place) + sparkles, and a pop off the word that just won it.
    setTimeout(()=>{ const g=app.querySelector('.xw-grid'); if(!g) return; addSparkles(g);
      const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
      if(reduce) return;
      g.querySelectorAll('.xw-cell').forEach(el=>{ const d2=(+el.dataset.r)+(+el.dataset.c);
        el.style.animationDelay=(90+d2*45)+'ms'; el.classList.add('xw-wave'); });
      finalWords.forEach(idx=>{ const cells=d.placed[idx].cells, [lr,lc]=cells[cells.length-1];
        const el=g.querySelector(`.xw-cell[data-r="${lr}"][data-c="${lc}"]`);

    return;
  }
  const xwinput=document.getElementById('xwinput');
  app.querySelectorAll('.xw-cell').forEach(el=> el.onclick=()=>{ xwSelect(+el.dataset.r,+el.dataset.c); renderCrossword(p); xwinput&&xwinput.focus(); });
  if(xwinput){ xwinput.oninput=()=>{ const v=xwinput.value.replace(/[^a-zA-Z]/g,''); xwinput.value=''; xwTypeAll(p,v); };
    xwinput.onkeydown=(e)=>{ e.stopPropagation(); if(e.key==='Backspace'){ xwBackspace(p); e.preventDefault(); }
      else if(e.key==='ArrowLeft'){ xwMove(p,0,-1); e.preventDefault(); }
      else if(e.key==='ArrowRight'){ xwMove(p,0,1); e.preventDefault(); }
      else if(e.key==='ArrowUp'){ xwMove(p,-1,0); e.preventDefault(); }
      else if(e.key==='ArrowDown'){ xwMove(p,1,0); e.preventDefault(); } };
    if(XW.sel) xwinput.focus(); }
  document.getElementById('xwhint').onclick=()=>xwHint(p);
  app.querySelectorAll('.xw-clue').forEach(li=> li.onclick=()=>{ XW.sel={r:+li.dataset.r,c:+li.dataset.c,dir:li.dataset.dir}; renderCrossword(p); });
  document.getElementById('back').onclick=()=>{ xwUnbindKeys(); XW=null; gameBack(p); };
  if(XW.just&&XW.just.length){
    const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
    XW.just.forEach(idx=>{ const cells=d.placed[idx].cells, lastI=cells.length-1;
      const cls=d.placed[idx].dir==='D'?'xw-snake':'xw-wave';   // down = snake sideways, across = undulate up
      cells.forEach(([r,c],i)=>{ const el=app.querySelector(`.xw-cell[data-r="${r}"][data-c="${c}"]`); if(!el) return;
        if(reduce){ if(i===lastI) celebrate(null,el); return; }
        el.style.animationDelay=(i*65)+'ms'; el.classList.add(cls);   // staggered = a wave travelling down the word
        if(i===lastI) setTimeout(()=>{ celebrate(null,el); xwPop(el, d.placed[idx].q, getAns(p)[d.placed[idx].q.id]); }, i*65+150);   // sparkle + a context-aware pop ride the crest
      });
    });
    const last=d.placed[XW.just[XW.just.length-1]];
    document.getElementById('xwmsg').innerHTML=`<div class="reveal"><div class="label">You got it</div><div class="talk"><b>${talkLead()}:</b> ${last.q.talk}</div></div>`;

}

function scrDone(){
