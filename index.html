const PROPER={place:1,name:1,friend:1,secret:1,pride:1};
let _xwLastPop=-1;
function catMatch(cat, a){ const list=POP_CATS[cat]; if(!list) return null; for(const [re,g] of list){ if(re.test(a)) return g; } return null; }
// Broad fallback: look each answer word up in the bundled emoji lexicon, with light stemming
// so "running"/"cats"/"baked" still hit "run"/"cat"/"bake".
function lexMatch(a){
  const lex=window.XW_EMOJI; if(!lex) return null;
  for(const w of a.split(/[^a-z]+/)){ if(w.length<3) continue;
    const forms=[w];
    if(w.length>4){ if(w.endsWith('ing')) forms.push(w.slice(0,-3), w.slice(0,-3)+'e');
      if(w.endsWith('ed')) forms.push(w.slice(0,-2), w.slice(0,-1));
      if(w.endsWith('es')) forms.push(w.slice(0,-2));
      if(w.endsWith('s')) forms.push(w.slice(0,-1)); }
    for(const f of forms){ if(lex[f]) return lex[f]; }
  }
  return null;
}
function popGlyphFor(q, answer){
  const a=(answer||'').toLowerCase();
  const qk=(((q&&q.id)||'')+' '+((q&&q.label)||'')+' '+((q&&q.ask)||'')).toLowerCase();
  let qcat=null; for(const [re,c] of QCAT){ if(re.test(qk)){ qcat=c; break; } }
  // 1) prefer a curated answer match inside the question's own category (the "balance")
  if(qcat){ const m=catMatch(qcat,a); if(m) return m; }
  // Proper-noun answers (hometown, nickname, friend's name, a private fact) never go
  // through the object lexicon — a real in-category word already matched in step 1
  // (lake/beach/...); otherwise lock to the category's own theme glyph.
  if(PROPER[qcat]) return CAT_THEME[qcat];
  // 2) any curated answer match in another category
  for(const cat of CAT_ORDER){ if(cat===qcat) continue; const m=catMatch(cat,a); if(m) return m; }
  // 3) the broad emoji lexicon (covers the long tail: accordion, lobster, ...)
  const lx=lexMatch(a); if(lx) return lx;
  // 4) the question's theme glyph
  if(qcat && CAT_THEME[qcat]) return CAT_THEME[qcat];
  // 5) a warm random glyph, never the same one twice in a row
  let i=Math.floor(Math.random()*XW_POPS.length); if(i===_xwLastPop) i=(i+1)%XW_POPS.length; _xwLastPop=i; return XW_POPS[i];
}
function xwPop(host, q, answer){
  if(!host) return;
  const s=document.createElement('span'); s.className='xw-pop'; s.textContent=popGlyphFor(q, answer);
  host.appendChild(s); setTimeout(()=>{ s.remove(); },1600);
}
function addSparkles(host){
  if(!host) return;
  for(let i=0;i<7;i++){ const s=document.createElement('span'); s.textContent='✦';
    s.style.cssText=`position:absolute; z-index:4; left:${16+Math.random()*68}%; top:${14+Math.random()*68}%; color:var(--amber); font-size:${14+Math.random()*14}px; pointer-events:none; animation:spark .8s ease-out ${i*35}ms both;`;
    host.appendChild(s); setTimeout(()=>s.remove(),1000); }
}
/* Shared "alive" reveal animation (engine hook): blooms an element and scatters
   sparkles over a host. Any game can call it. No-ops under reduced-motion. */
function celebrate(bloomEl, host){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  if(bloomEl) bloomEl.classList.add('bloom');
  addSparkles(host||bloomEl);
}

/* ---------- CROSSWORD ----------
   The person's single-word answers, criss-crossed. Clues are the questions about
   them, so filling it in = working out what they said (the crossing letters help).
   Tap a square, then tap the on-screen letters OR type on a real keyboard. */
let XW=null, _xwKeyHandler=null;
function scrCrossword(){
  const p=S.game.target;
  if(!XW||XW.for!==p){
    // Phones get a puzzle packed 12 squares wide (layout D); computers keep the squarer grid.
    const data=buildCrossword(wordAnswers(p).map(x=>({word:x.word, q:x.q})), xwIsPhone()?{maxW:12}:null);
    const order=[...data.placed].filter(pl=>pl.dir==='A').sort((a,b)=>a.num-b.num)
      .concat([...data.placed].filter(pl=>pl.dir==='D').sort((a,b)=>a.num-b.num));
    XW={for:p, data, order, entry:new Map(), sel:null, solved:new Set(), just:[]};
    const first=order[0];
    if(first) XW.sel={r:first.cells[0][0], c:first.cells[0][1], dir:first.dir};
  }
  renderCrossword(p);
  xwBindKeys(p);   // physical keyboard works too (on-screen pad still works for tap-only)
}
// One document-level keydown listener for the whole crossword session (the on-screen
// pad is wired per-render, but a physical keyboard needs a persistent listener).
function xwBindKeys(p){
  xwUnbindKeys();
  _xwKeyHandler=(e)=>{
    if(S.screen!=='crossword'||!XW){ xwUnbindKeys(); return; }
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    const k=e.key;
    if(/^[a-zA-Z]$/.test(k)){ xwLetter(p,k.toUpperCase()); e.preventDefault(); }
    else if(k==='Backspace'){ xwBackspace(p); e.preventDefault(); }
    else if(k==='ArrowLeft'){ xwMove(p,0,-1); e.preventDefault(); }
    else if(k==='ArrowRight'){ xwMove(p,0,1); e.preventDefault(); }
    else if(k==='ArrowUp'){ xwMove(p,-1,0); e.preventDefault(); }
    else if(k==='ArrowDown'){ xwMove(p,1,0); e.preventDefault(); }
  };
  document.addEventListener('keydown',_xwKeyHandler);
}
function xwUnbindKeys(){ if(_xwKeyHandler){ document.removeEventListener('keydown',_xwKeyHandler); _xwKeyHandler=null; } }
function xwMove(p,dr,dc){
  if(!XW.sel) return; const d=XW.data; let r=XW.sel.r, c=XW.sel.c;
  for(let n=0;n<Math.max(d.rows,d.cols);n++){ r+=dr; c+=dc;
    if(r<0||c<0||r>=d.rows||c>=d.cols) return;
    if(d.cells.get(xwKey(r,c))){
      const dir = dc!==0?'A':'D';
      const has = d.placed.some(pl=>pl.dir===dir && pl.cells.some(([rr,cc])=>rr===r&&cc===c));
      XW.sel={r,c,dir: has?dir:XW.sel.dir}; renderCrossword(p); return;
    }
  }
}
function xwKey(r,c){ return r+','+c; }
function xwActiveWord(){ if(!XW.sel) return null;
  return XW.data.placed.find(pl=> pl.dir===XW.sel.dir && pl.cells.some(([r,c])=>r===XW.sel.r&&c===XW.sel.c)); }
function xwSelect(r,c){
  // Only a clue's first letter lights up its lane. A middle/crossing square just
  // takes the cursor (dir:null → no active word highlight).
  const startA=XW.data.placed.find(pl=>pl.dir==='A'&&pl.cells[0][0]===r&&pl.cells[0][1]===c);
  const startD=XW.data.placed.find(pl=>pl.dir==='D'&&pl.cells[0][0]===r&&pl.cells[0][1]===c);
  if(startA||startD){
    let dir;
    if(XW.sel&&XW.sel.r===r&&XW.sel.c===c){ dir = (XW.sel.dir==='A'&&startD)?'D':(XW.sel.dir==='D'&&startA)?'A':(startA?'A':'D'); } // re-tap toggles when it starts both
    else { dir = startA?'A':'D'; }
    XW.sel={r,c,dir};
  } else {
    if(!XW.data.placed.some(pl=>pl.cells.some(([rr,cc])=>rr===r&&cc===c))) return;
    XW.sel={r,c,dir:null};
  }
}
function xwFirstEmpty(pl){ for(const [r,c] of pl.cells){ if(!XW.entry.get(xwKey(r,c))) return {r,c}; } return {r:pl.cells[0][0], c:pl.cells[0][1]}; }
function xwGoClue(step, onlyUnsolved){
  const aw=xwActiveWord(), L=XW.order.length; if(!L) return;
  let idx=Math.max(0, XW.order.indexOf(aw));
  for(let n=1;n<=L;n++){ const w=XW.order[((idx+step*n)%L+L)%L];
    if(onlyUnsolved && XW.solved.has(XW.data.placed.indexOf(w))) continue;
    const fe=xwFirstEmpty(w); XW.sel={r:fe.r, c:fe.c, dir:w.dir}; return; }
  const w=XW.order[((idx+step)%L+L)%L], fe=xwFirstEmpty(w); XW.sel={r:fe.r, c:fe.c, dir:w.dir};
}
function xwAdvance(){ const aw=xwActiveWord(); if(!aw) return;
  const i=aw.cells.findIndex(([r,c])=>r===XW.sel.r&&c===XW.sel.c);
  if(i>=0 && i+1<aw.cells.length){ const [r,c]=aw.cells[i+1]; XW.sel={r,c,dir:aw.dir}; return; }  // next cell, never skip filled ones (or letters misalign at a crossing)
  if(aw.cells.every(([r,c])=>XW.entry.get(xwKey(r,c)))) xwGoClue(1, true);   // word complete: hop to the next unfinished clue
}
function xwRecompute(){ const now=new Set();
  XW.data.placed.forEach((pl,idx)=>{ if(pl.cells.every(([r,c])=>XW.entry.get(xwKey(r,c))===XW.data.cells.get(xwKey(r,c)).sol)) now.add(idx); });
  XW.just=[...now].filter(idx=>!XW.solved.has(idx)); XW.solved=now;
}
// Some phone keyboards hand over several letters in one go (fast typing, a suggestion
// tapped): place every one of them, in order, and stop if the puzzle gets finished.
function xwTypeAll(p,v){ for(const ch of v.toUpperCase()){ if(!XW||!XW.sel||(XW.solved.size===XW.data.placed.length)) break; xwLetter(p,ch); } }
function xwLetter(p,ch){ if(!XW.sel) return; const k=xwKey(XW.sel.r,XW.sel.c); XW.entry.set(k,ch); XW.typed=true; XW.justTyped=k;
  xwRecompute(); xwAdvance();
  if(XW.just.length) vib(XW.solved.size===XW.data.placed.length?[20,60,30]:18); else letterTick();
  renderCrossword(p); }
function xwBackspace(p){ if(!XW.sel) return; const k=xwKey(XW.sel.r,XW.sel.c);
  if(XW.entry.get(k)){ XW.entry.delete(k); }
  else { const aw=xwActiveWord(); if(aw){ const i=aw.cells.findIndex(([r,c])=>r===XW.sel.r&&c===XW.sel.c);
    if(i>0){ const [r,c]=aw.cells[i-1]; XW.sel={r,c,dir:aw.dir}; XW.entry.delete(xwKey(r,c)); } } }
  xwRecompute(); renderCrossword(p);
}
function xwHint(p){ if(!XW.sel) return; let k=xwKey(XW.sel.r,XW.sel.c), cell=XW.data.cells.get(k); if(!cell) return;
  // Square already right? Give the word's first empty square instead, so a hint is never wasted.
  if(XW.entry.get(k)===cell.sol){ const aw=xwActiveWord(); if(aw){ const fe=aw.cells.find(([r,c])=>!XW.entry.get(xwKey(r,c)));
    if(fe){ XW.sel={r:fe[0],c:fe[1],dir:aw.dir}; k=xwKey(fe[0],fe[1]); cell=XW.data.cells.get(k); } } }
  XW.entry.set(k,cell.sol); xwRecompute(); xwAdvance(); renderCrossword(p); }
function xwArrow(p,step){ xwGoClue(step,false); renderCrossword(p); }
/* Phone layout D (r20, Lance: "build D into the game"): the layout most phone crossword
   apps use. The puzzle is packed 12 squares wide (buildCrossword maxW) so every column
   shows at a readable size, and it scrolls up and down by itself to keep your word in
   view. The question sits in one bar right above the game's OWN letter keyboard, so the
   phone's keyboard (and its AutoFill bar) never appears and the page never jumps.
   Computers and tablets (wider than 600px) keep the big grid + clue list and type on
   their real keyboard. (Layouts A and B from r18/r19 were removed; see round_19.html.) */
function xwIsPhone(){ return window.innerWidth<=600; }
// The word being worked on; a bare cursor square adopts the word through it (across first).
function xwPhoneWord(){
  let aw=xwActiveWord(); if(aw) return aw;
  if(!XW.sel) return null;
  const hits=XW.data.placed.filter(pl=>pl.cells.some(([r,c])=>r===XW.sel.r&&c===XW.sel.c));
  aw=hits.find(pl=>pl.dir==='A')||hits[0]; if(aw) XW.sel.dir=aw.dir; return aw;
}
// Tap a square: move there. Tap the square you are already on: switch to the word crossing it.
function xwPhonePick(r,c){
  const hits=XW.data.placed.filter(pl=>pl.cells.some(([rr,cc])=>rr===r&&cc===c)); if(!hits.length) return;
  const aw=xwPhoneWord(), onIt=XW.sel&&XW.sel.r===r&&XW.sel.c===c;
  const w = onIt&&hits.length>1 ? hits.find(h=>h!==aw) : (hits.includes(aw)?aw:hits[0]);
  XW.sel={r,c,dir:w.dir};
}
// Tapping the question switches between across and down at the same square.
function xwFlip(){ if(!XW.sel) return; const aw=xwPhoneWord();
  const x=XW.data.placed.find(pl=>pl!==aw&&pl.cells.some(([a,b])=>a===XW.sel.r&&b===XW.sel.c));
  if(x) XW.sel={r:XW.sel.r, c:XW.sel.c, dir:x.dir}; }

/* ===================== FEEL (r22, from the design research) =====================
   Three sizes of "well done": a letter gets a tiny pop and a soft low tock; a word lifts off its
   squares; the finish lights the whole puzzle. Sounds are warm and low (ageing ears lose the high
   notes first) and an iPhone's silent switch quiets them. Android phones also give a small buzz.
   Everything big can be skipped with any tap, and the phone's Reduce Motion setting swaps the
   moving parts for a still fade. */
const isReduced=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
const theme=()=>document.body.dataset.theme==='night'?'night':'day';
const rnd=(a,b)=>a+Math.random()*(b-a);
let _ac=null;
function ac(){ if(!SOUND_ON) return null; try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume(); return _ac; }catch(e){ return null; } }
function note(f,at,dur,vol,type){ const a=ac(); if(!a) return; const t=a.currentTime+0.02+at, o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05); }
const SCALE=[0,2,4,7,9,12,14,16,19,21,24,26];
function ticks(n,start,gap){ const base=theme()==='night'?294:330; for(let i=0;i<n;i++) note(base*Math.pow(2,SCALE[Math.min(i,SCALE.length-1)]/12)*rnd(.99,1.01), start+i*gap, .14, .08); }
function letterTick(){ note((theme()==='night'?220:262)*rnd(.97,1.03),0,.08,.06,'triangle'); vib(8); }
function bellWord(at){ const b=theme()==='night'?440:523; [[b,0,.9,.14],[b*1.335,.1,1.3,.12]].forEach(([f,t,d,v])=>{ note(f,at+t,d,v); note(f*2,at+t,d*.6,v*.2); }); }
function bellFinish(at){ const b=theme()==='night'?294:330; [[b,0],[b*1.26,.14],[b*1.5,.28],[b*2,.44]].forEach(([f,t],i)=>{ note(f,at+t,i===3?2.2:1,.13); note(f*2,at+t,.7,.03); }); }
function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

// Light particles on a canvas laid over the screen. Positions come from the clock, never the frame
// count, so a slow phone never plays the moment in slow motion.
let _fx=null, _cv=null, _cx=null, _parts=[], _running=false; const _sprites={};
function fxLayer(){ if(_fx&&_fx.isConnected) return _fx;
  _fx=document.createElement('div'); _fx.id='fx'; document.body.appendChild(_fx);
  _cv=document.createElement('canvas'); _cv.id='fxc'; document.body.appendChild(_cv); _cx=_cv.getContext('2d'); fxFit(); return _fx; }
function fxFit(){ if(!_cv) return; const d=Math.min(2,window.devicePixelRatio||1); _cv.width=innerWidth*d; _cv.height=innerHeight*d; _cv.style.width=innerWidth+'px'; _cv.style.height=innerHeight+'px'; _cx.setTransform(d,0,0,d,0,0); }
window.addEventListener('resize',fxFit);
function glowSprite(col,core){ core=core||'#fff'; const key=col+core; if(_sprites[key]) return _sprites[key]; const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const rg=g.createRadialGradient(32,32,0,32,32,32); rg.addColorStop(0,core); rg.addColorStop(.18,col); rg.addColorStop(.45,col+'66'); rg.addColorStop(1,col+'00');
  g.fillStyle=rg; g.fillRect(0,0,64,64); return _sprites[key]=c; }
function emit(q){ fxLayer(); q.t0=performance.now()+(q.delay||0)*1000; _parts.push(q); if(!_running){ _running=true; requestAnimationFrame(fxLoop); } }
function fxLoop(now){ _cx.clearRect(0,0,innerWidth,innerHeight);
  _parts=_parts.filter(q=>now<q.t0||(now-q.t0)/1000<q.life);
  for(const q of _parts){ if(now<q.t0) continue; const a=(now-q.t0)/1000, k=q.drag||0, f=k?(1-Math.exp(-k*a))/k:a;
    let x=q.x+q.vx*f, y=q.y+q.vy*f+0.5*(q.g||0)*a*a; if(q.wob) x+=Math.sin(a*(q.wf||3)+(q.ph||0))*q.wob;
    const t=a/q.life, fa=q.fadeAt??.6; let al=t>fa?Math.max(0,1-(t-fa)/(1-fa)):1; if(q.fadeIn) al*=Math.min(1,a/q.fadeIn);
    _cx.globalAlpha=al; if(!q.soft) _cx.globalCompositeOperation='lighter';
    const sz=q.r*(q.grow?1+a*q.grow:1); _cx.drawImage(q.soft?glowSprite(q.col,q.col):glowSprite(q.col),x-sz,y-sz,sz*2,sz*2); _cx.globalCompositeOperation='source-over'; }
  _cx.globalAlpha=1;
  if(_parts.length) requestAnimationFrame(fxLoop); else { _running=false; _cx.clearRect(0,0,innerWidth,innerHeight); } }
function burst(x,y,n,o){ for(let i=0;i<n;i++){ const ang=rnd(0,6.283), sp=rnd(o.sp[0],o.sp[1]);
  emit(Object.assign({kind:'glow',x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp},o.base,{col:o.cols[i%o.cols.length], r:rnd(o.r[0],o.r[1]), delay:(o.delay||0)+rnd(0,o.jit||0)})); } }
function fxClear(){ _parts=[]; if(_fx) _fx.innerHTML=''; }

/* The right answer lifts off its own squares: each letter rises into the word, spaced and
   accented the way the person typed it ("Butter pecan", "Día de Muertos"), holds big enough to
   read, then drops back in and its square lights up. About 1.4 seconds; any tap skips it, and
   typing never waits for it (the next clue is already set). */
let _lift=null;
function skipLift(){ if(!_lift) return; const L=_lift; _lift=null; L.anims.forEach(a=>{ try{ a.cancel(); }catch(e){} }); L.timers.forEach(clearTimeout);
  L.holder.remove(); L.plate.remove(); L.cells.forEach(el=>el.classList.remove('lifted')); }
function liftLetters(pl,p){
  const raw=String(getAns(p)[pl.q.id]||''), out=[];
  for(const ch of raw){ if(/\s|-/.test(ch)){ if(out.length&&out[out.length-1]!==' ') out.push(' '); } else if(gridWord(ch).length===1) out.push(ch.toUpperCase()); }
  while(out[out.length-1]===' ') out.pop();
  return out.filter(x=>x!==' ').length===pl.cells.length ? out : [...pl.word];
}
function liftWord(pl,p,board){
  const cells=pl.cells.map(([r,c])=>board.querySelector(`.xw-cell[data-r="${r}"][data-c="${c}"]`));
  if(cells.some(x=>!x)) return 0;
  const lay=fxLayer(), th=theme(), reduce=isReduced();
  const B=board.getBoundingClientRect(), ra=cells[0].getBoundingClientRect(), rb=cells[cells.length-1].getBoundingClientRect(), Ry=(ra.top+rb.bottom)/2;
  const letters=liftLetters(pl,p), n=pl.cells.length, gaps=letters.filter(x=>x===' ').length;
  const fs=Math.round(Math.max(24,Math.min(48,(innerWidth-56)/(n*0.8+gaps*0.42))));
  const top = pl.dir==='A' ? Math.max(B.top+fs*1.1, Math.min(Ry-fs*1.9, B.bottom-fs*1.1)) : B.top+B.height*0.42;
  const holder=document.createElement('div'); holder.className='lift '+th; holder.style.fontSize=fs+'px'; holder.style.top=top+'px';
  const spans=[]; for(const ch of letters){ const sp=document.createElement('span'); if(ch===' ') sp.className='sp'; else { sp.className='lt'; sp.textContent=ch; spans.push(sp); } holder.appendChild(sp); }
  lay.appendChild(holder);
  const hb=holder.getBoundingClientRect(), plate=document.createElement('div'); plate.className='plate '+th;
  const pw=Math.min(hb.width+fs*1.8, innerWidth-12), pleft=Math.max(6, hb.left+hb.width/2-pw/2);
  Object.assign(plate.style,{left:pleft+'px', top:(hb.top-fs*0.55)+'px', width:pw+'px', height:(hb.height+fs*1.1)+'px'});
  lay.insertBefore(plate,holder);
  const L=_lift={anims:[], timers:[], holder, plate, cells};
  if(reduce){ // still version for Reduce Motion: the word fades in big where it is, holds, fades out; nothing moves
    const fade=[{opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.85},{opacity:0}];
    L.anims.push(holder.animate(fade,{duration:1500,fill:'both'}), plate.animate(fade,{duration:1500,fill:'both'}));
    bellWord(0.05); L.timers.push(setTimeout(()=>{ if(_lift===L) skipLift(); },1550)); return 1550; }
  const tileFs=parseFloat(getComputedStyle(cells[0]).fontSize)||16;
  const from=spans.map((sp,i)=>{ const a=sp.getBoundingClientRect(), t=cells[i].getBoundingClientRect();
    return `translate(${(t.left+t.width/2)-(a.left+a.width/2)}px, ${(t.top+t.height/2)-(a.top+a.height/2)}px) scale(${(tileFs/fs).toFixed(3)})`; });
  const up=0.42, st=0.025, hold=0.55, down=0.32, st2=0.02;
  const holdAt=up+(n-1)*st, backAt=holdAt+hold;
  L.anims.push(plate.animate([{opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.82},{opacity:0}],{duration:(backAt+0.2)*1000, delay:120, fill:'both', easing:'ease-in-out'}));
  ticks(n,0,st); bellWord(holdAt-0.05);
  spans.forEach((sp,i)=>{
    L.anims.push(sp.animate([{transform:from[i]},{transform:'none'}],{duration:up*1000, delay:i*st*1000, easing:'cubic-bezier(.2,.9,.25,1.12)', fill:'both'}));
    L.timers.push(setTimeout(()=>{ if(_lift===L) cells[i].classList.add('lifted'); }, i*st*1000+20));

    });
    const last=d.placed[XW.just[XW.just.length-1]];
    document.getElementById('xwmsg').innerHTML=`<div class="reveal"><div class="label">You got it</div><div class="talk">${last.q.talk}</div></div>`;
    XW.just=[];
  }
}

/* ---------- STORY VIEW ---------- */
function scrStoryView(){
  const p=S.game.target, st=getStories(p), items=STORIES.filter(s=>st[s.id]);
  const them=p==='them';
  const cards=items.length ? items.map(s=>`
    <div class="reveal" style="margin-top:16px">
      <div class="label">${s.label}</div>
      <div class="ans" style="font-size:1.5rem;line-height:1.35">${esc(st[s.id])}</div>
      <div class="talk" style="margin-top:12px">${s.talk}</div></div>`).join('')
    : `<div class="card center"><p style="margin:0" class="hint">${getName(p)} skipped these.</p></div>`;
  app.innerHTML=`
    <div class="center" style="margin:6px 0 4px">
      <h2>${getName(p)}'s stories</h2></div>
    ${cards}
    <div style="margin-top:20px"><button class="btn-amber" id="go">Back to games</button></div>`;
  document.getElementById('go').onclick=()=>gameBack(p);
}

/* ---------- REPLY ---------- */
function scrReplyIntro(){
  const them=getName('them');
  app.innerHTML=`
    <div class="center" style="margin-top:24px"></div>
    <div class="card center stack">
      <h2>Make one for ${them}</h2>
      <button class="btn-teal" id="go">Start</button>
      <button class="btn-ghost" id="skip">Not now</button></div>`;
  document.getElementById('go').onclick=()=>go('remote_start');
  document.getElementById('skip').onclick=()=>go('done');
}

/* ---------- DONE / KEEPSAKE ---------- */
function presentSlots(){return ['them','me'].filter(p=>S.people[p]&&(QUESTIONS.some(q=>getAns(p)[q.id])||STORIES.some(s=>getStories(p)[s.id])));}
function canExport(){
  return !!(S.people['them']&&S.people['them'].consent&&S.myAgree);
}
function renderExport(){
  const exp=document.getElementById('exp'); if(!exp)return;
  exp.innerHTML = canExport()
    ? `<div class="stack" style="margin-top:8px">
         <button class="btn-amber" id="savepic">Save picture</button>
         <button class="btn-ghost" id="printk">Print</button>
       </div>`
    : `<p class="hint center" style="margin-top:8px">You both have to agree first.</p>`;
  if(document.getElementById('savepic')) document.getElementById('savepic').onclick=exportKeepsake;
  if(document.getElementById('printk')) document.getElementById('printk').onclick=()=>window.print();
}
function scrDone(){
  const block=(p,color)=>{const items=QUESTIONS.filter(q=>getAns(p)[q.id]);
    const st=getStories(p), storyItems=STORIES.filter(s=>st[s.id]);
    if(!items.length&&!storyItems.length)return '';
    const cards=items.map(q=>`<div class="summary-card"><div class="label">${q.label}</div>
      <div class="v">${esc(getAns(p)[q.id])}</div></div>`).join('');
    const stories=storyItems.map(s=>`<div class="summary-card"><div class="label">${s.label}</div>
      <div class="v" style="font-size:1.2rem;line-height:1.4">${esc(st[s.id])}</div></div>`).join('');
    return `<div style="margin-top:18px"><div class="pill pill-${color}" style="margin-bottom:12px">${getName(p)}</div>
      <div class="stack">${cards}${stories}</div></div>`;};

  const slots=presentSlots();
  let controls;
  if(slots.length<2){
    controls=`<p class="hint center" style="margin:0">You can save a copy once they send one back.</p>`;
  } else if(S.people['them']&&S.people['them'].consent){
    controls=`
      <p class="center" style="margin:0 0 12px"><b>${getName('them')}</b> wants to save a copy. Do you?</p>
      <label class="agreebox"><input type="checkbox" id="am" ${S.myAgree?'checked':''}><span>Yes</span></label>
      <div id="exp"></div>`;
  } else {
    controls=`<p class="hint center" style="margin:0">${getName('them')} chose not to save a copy.</p>`;
  }

  app.innerHTML=`
    <div class="center" style="margin:10px 0 6px">
      <h1 style="margin-top:8px">All answers</h1></div>
    ${block('them','amber')}${block('me','teal')}
    <div class="card stack" style="margin-top:22px"><h3 class="center">Save a copy</h3>${controls}</div>
    <div style="margin-top:20px"><button class="btn-ghost" id="restart">Start over</button></div>`;

  if(document.getElementById('am')) document.getElementById('am').onchange=e=>{S.myAgree=e.target.checked;renderExport();};
  renderExport();
  document.getElementById('restart').onclick=()=>{location.hash='';S={screen:'home',people:{},iv:null,qi:0,si:0,pack:null,qlist:[],slist:[],game:null,link:null,outConsent:true,myAgree:false};resetGames();go('home');};
}

function wrapText(ctx,text,maxW,font){
  ctx.font=font; const words=String(text).split(/\s+/), lines=[]; let line='';
  for(const w of words){const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;}
  if(line)lines.push(line); return lines;
}
function exportKeepsake(){
  const slots=presentSlots();
  const colors={them:'#D99B2B',me:'#1F5A5A'};
  const W=820, PAD=50, contentW=W-2*PAD-10;
  const cv=document.createElement('canvas'); cv.width=W;
  const x=cv.getContext('2d');
  const sections=slots.map(p=>{
    const items=QUESTIONS.filter(q=>getAns(p)[q.id]).map(q=>({label:q.label,value:getAns(p)[q.id]}));
    const st=getStories(p);
    const stories=STORIES.filter(s=>st[s.id]).map(s=>({label:s.label,lines:wrapText(x,st[s.id],contentW,'18px Georgia')}));
    return {name:getName(p), color:colors[p]||'#1F5A5A', items, stories};
  });
  let H=190;
  for(const s of sections){
    H+=44+s.items.length*58;
    for(const st of s.stories){ H+=30+st.lines.length*24+12; }
    H+=18;
  }
  H+=60; cv.height=H;
  x.fillStyle='#F7F2E9'; x.fillRect(0,0,W,H);
  x.fillStyle='#2A2622'; x.font='600 40px Georgia'; x.fillText('Two of Us',PAD,80);
  x.font='20px Georgia'; x.fillStyle='#6E655B'; x.fillText('Our answers',PAD,116);
  x.strokeStyle='#D99B2B'; x.lineWidth=3; x.beginPath(); x.moveTo(PAD,140); x.lineTo(W-PAD,140); x.stroke();
  let y=190;
  for(const s of sections){
    x.fillStyle=s.color; x.font='600 28px Georgia'; x.fillText(s.name,PAD,y); y+=44;
    for(const it of s.items){
      x.fillStyle='#6E655B'; x.font='14px Georgia'; x.fillText(String(it.label).toUpperCase(),PAD+10,y);
      x.fillStyle='#2A2622'; x.font='600 22px Georgia'; x.fillText(String(it.value),PAD+10,y+26); y+=58;
    }
    for(const st of s.stories){
      x.fillStyle='#6E655B'; x.font='14px Georgia'; x.fillText(String(st.label).toUpperCase(),PAD+10,y); y+=24;
      x.fillStyle='#2A2622'; x.font='18px Georgia';
      for(const ln of st.lines){ x.fillText(ln,PAD+10,y); y+=24; }
      y+=12;
    }
    y+=18;
  }
  x.fillStyle='#6E655B'; x.font='italic 16px Georgia';
  x.fillText('Kept with the agreement of both.  ·  Two of Us',PAD,H-30);
  const a=document.createElement('a'); a.download='our-keepsake.png'; a.href=cv.toDataURL('image/png'); a.click();
}

/* Quick single-puzzle save from the crossword finish: the solved grid drawn on top,
   then the clue answers below. The receiver's own copy of what they worked out. */
function exportCrossword(p){
  const d=XW&&XW.data; if(!d) return;
  const nm=getName(p);
  const W=820, PAD=50, contentW=W-2*PAD;
  const cv=document.createElement('canvas'); cv.width=W;
  const x=cv.getContext('2d');
  const N=Math.max(d.rows,d.cols), offR=Math.floor((N-d.rows)/2), offC=Math.floor((N-d.cols)/2);
  const gcell=Math.min(Math.floor(contentW/N), 44), gw=gcell*N, gx=(W-gw)/2, gy=180;
  const items=d.placed.slice().sort((a,b)=>a.num-b.num).map(pl=>({label:pl.q.label, value:(getAns(p)[pl.q.id]||'').trim()}));
  const listTop=gy+gw+44;
  cv.height=listTop + items.length*58 + 60;
  const H=cv.height;
  x.fillStyle='#F7F2E9'; x.fillRect(0,0,W,H);
  x.fillStyle='#2A2622'; x.font='600 38px Georgia'; x.fillText('Two of Us',PAD,76);
  x.font='20px Georgia'; x.fillStyle='#6E655B'; x.fillText('A crossword about '+nm,PAD,110);
  x.strokeStyle='#D99B2B'; x.lineWidth=3; x.beginPath(); x.moveTo(PAD,134); x.lineTo(W-PAD,134); x.stroke();
  // solved grid
  x.fillStyle='#A9C4BE'; x.fillRect(gx-2, gy-2, gw+4, gw+4);
  x.textAlign='center'; x.textBaseline='middle';
  for(let dr=0;dr<N;dr++) for(let dc=0;dc<N;dc++){ const r=dr-offR, c=dc-offC;
    const inb=r>=0&&r<d.rows&&c>=0&&c<d.cols, cell=inb?d.cells.get(xwKey(r,c)):null;
    const cx=gx+dc*gcell, cy=gy+dr*gcell;
    x.fillStyle = cell? '#fff' : '#B7CEC9'; x.fillRect(cx+1, cy+1, gcell-2, gcell-2);
    if(cell){
      x.fillStyle='#2A2622'; x.font='700 '+Math.floor(gcell*0.55)+'px Georgia';
      x.fillText(cell.sol, cx+gcell/2, cy+gcell/2+1);
      if(cell.num){ x.textAlign='left'; x.textBaseline='top'; x.fillStyle='#6E655B'; x.font=Math.floor(gcell*0.3)+'px Georgia';
        x.fillText(cell.num, cx+3, cy+2); x.textAlign='center'; x.textBaseline='middle'; }
    }
  }
  // answer list
  x.textAlign='left'; x.textBaseline='alphabetic';
  let y=listTop;
  for(const it of items){
    x.fillStyle='#6E655B'; x.font='14px Georgia'; x.fillText(String(it.label).toUpperCase(),PAD,y);
    x.fillStyle='#2A2622'; x.font='600 22px Georgia'; x.fillText(String(it.value),PAD,y+26); y+=58;
  }
  x.fillStyle='#6E655B'; x.font='italic 16px Georgia';
  
  const a=document.createElement('a'); a.download=(nm.replace(/[^a-z0-9]+/gi,'-')||'puzzle')+'-crossword.png'; a.href=cv.toDataURL('image/png'); a.click();
}

applyTheme();
render();
</script>
<script>
/* PWA: register the service worker so the app installs and works offline.
   On localhost (preview/dev) we do the OPPOSITE: unregister any existing worker
   and clear its caches, so the preview never serves a stale build. The offline
   PWA only matters on a real host, so this costs nothing in production. */
if('serviceWorker' in navigator){
  var _dev = ['localhost','127.0.0.1','[::1]',''].indexOf(location.hostname)!==-1;
  window.addEventListener('load',()=>{
    if(_dev){
      navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
      if(window.caches) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
    } else {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  });
}
</script>
